<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>ZoneNOW - 勉強を始めるきっかけを</title>

<!-- ▼ PWA(ホーム画面追加)のための設定 -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#10131A" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ZoneNOW" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  /* ============================================================
     デザイントークン（色・フォント・余白のルールをここに集約）
     この値だけ変えれば、アプリ全体の雰囲気を調整できます。
  ============================================================ */
  :root{
    --ink:#10131A;          /* ショート動画画面の背景色(ほぼ黒に近い紺) */
    --indigo:#2B2E63;       /* サブの暗い面(チップ・ナビ) */
    --indigo-soft:#3B3F86;
    --paper:#F7F6F2;        /* 検索画面などの明るい背景 */
    --paper-line:#E7E4DC;
    --ink-text:#1B1D26;
    --muted:#8B8D9B;
    --ember:#FF5A36;        /* アクセント：やる気の火種（いいね・保存・フォロー済み） */
    --ember-soft:#FF8A6B;
    --mint:#33D6A6;         /* Zoneメーターの到達色 */
    --cta-from:#4F8CFF;     /* CTA・中央ナビボタンのグラデーション */
    --cta-to:#8B5CF6;
    --white:#FFFFFF;
    --font-display:'Zen Kaku Gothic New', sans-serif;
    --font-ui:'Inter', 'Zen Kaku Gothic New', sans-serif;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; height:100%; overscroll-behavior:none;
    font-family:var(--font-display); background:var(--ink); color:var(--white);
  }
  button{ font-family:inherit; border:none; background:none; cursor:pointer; -webkit-user-select:none; user-select:none; }
  svg{ display:block; }
  ::-webkit-scrollbar{ display:none; }

  #app{ position:fixed; inset:0; overflow:hidden; }

  /* ============================================================
     画面切り替え（home / search / player / ai / record / profile / create）
  ============================================================ */
  .screen{ position:absolute; inset:0; opacity:0; pointer-events:none; transition:opacity .35s ease; }
  .screen.active{ opacity:1; pointer-events:auto; }

  /* ============================================================
     ホーム画面：ショート動画フィード
  ============================================================ */
  #feed{
    height:100%; width:100%; overflow-y:scroll; scroll-snap-type:y mandatory;
  }
  .short-slide{
    position:relative; height:100%; width:100%; scroll-snap-align:start; scroll-snap-stop:always;
    background:#000; overflow:hidden;
  }
  .short-slide video{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
  }
  .short-slide::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,.35) 0%, rgba(0,0,0,0) 22%, rgba(0,0,0,0) 55%, rgba(0,0,0,.75) 100%);
    pointer-events:none;
  }

  /* Zoneメーター（シグネチャー要素）：観るほど溜まっていくやる気の可視化 */
  .zone-meter{
    position:absolute; top:calc(var(--safe-top) + 10px); left:14px; right:14px; height:3px;
    background:rgba(255,255,255,.25); border-radius:99px; overflow:hidden; z-index:5;
  }
  .zone-meter-fill{
    height:100%; width:0%; border-radius:99px;
    background:linear-gradient(90deg, var(--ember), var(--mint));
    transition:width linear;
  }

  .short-top{
    position:absolute; top:calc(var(--safe-top) + 108px); left:16px; right:78px; z-index:4;
    display:flex; gap:6px; flex-wrap:wrap;
  }
  .badge{
    font-family:var(--font-ui); font-size:11px; font-weight:600; letter-spacing:.02em;
    padding:5px 10px; border-radius:99px; backdrop-filter:blur(6px);
    background:rgba(255,255,255,.14); color:#fff;
  }
  .badge.subject{ background:rgba(255,90,54,.85); }

  /* ---- 上部バー：検索・通知 ---- */
  #feed-topbar{
    position:absolute; top:calc(var(--safe-top) + 18px); left:16px; right:16px; z-index:12;
    display:flex; justify-content:space-between; align-items:center;
  }
  .icon-btn{
    position:relative; width:38px; height:38px; border-radius:50%;
    background:rgba(255,255,255,.14); backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center; color:#fff;
  }
  .icon-btn svg{ width:19px; height:19px; }
  .notif-dot{
    position:absolute; top:6px; right:7px; width:8px; height:8px; border-radius:50%;
    background:var(--ember); border:1.5px solid var(--ink);
  }

  /* ---- 「勉強を始める」CTA ---- */
  #feed-cta{
    position:absolute; top:calc(var(--safe-top) + 62px); right:16px; z-index:12;
    display:flex; align-items:center; gap:7px;
    padding:10px 16px 10px 14px; border-radius:99px;
    background:linear-gradient(135deg, var(--cta-from), var(--cta-to));
    color:#fff; font-family:var(--font-ui); font-size:13.5px; font-weight:700;
    box-shadow:0 8px 20px rgba(79,140,255,.4);
  }
  #feed-cta svg{ width:14px; height:14px; }
  #feed-cta.pulse{ animation:pulse 1.1s ease; }
  @keyframes pulse{ 0%{transform:scale(1);} 40%{transform:scale(1.15);} 100%{transform:scale(1);} }

  /* ---- 右側アクションレール：アバター・いいね・コメント・保存・シェア・ミュート ---- */
  .action-rail{
    position:absolute; right:12px; bottom:calc(var(--safe-bottom) + 108px); z-index:6;
    display:flex; flex-direction:column; align-items:center; gap:16px;
  }
  .avatar-wrap{ position:relative; margin-bottom:2px; }
  .avatar{
    width:44px; height:44px; border-radius:50%;
    background:linear-gradient(135deg, var(--cta-from), var(--cta-to));
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-family:var(--font-ui); font-weight:700; font-size:17px;
    border:2px solid rgba(255,255,255,.85);
  }
  .follow-badge{
    position:absolute; left:50%; bottom:-8px; transform:translateX(-50%);
    width:20px; height:20px; border-radius:50%;
    background:var(--ember); color:#fff;
    display:flex; align-items:center; justify-content:center;
    border:2px solid var(--ink);
  }
  .follow-badge svg{ width:12px; height:12px; }
  .follow-badge.active{ background:var(--mint); }
  .action-item{ display:flex; flex-direction:column; align-items:center; gap:3px; color:#fff; }
  .action-item svg{ width:27px; height:27px; filter:drop-shadow(0 1px 3px rgba(0,0,0,.4)); }
  .action-item.active svg{ fill:currentColor; color:var(--ember); }
  .action-count, .action-label{
    font-family:var(--font-ui); font-size:11px; font-weight:600;
    text-shadow:0 1px 4px rgba(0,0,0,.5);
  }
  .mute-item svg{ width:23px; height:23px; opacity:.85; }

  /* ---- 下部キャプション：タグ・説明・音源 ---- */
  .caption-block{
    position:absolute; left:16px; right:78px; bottom:calc(var(--safe-bottom) + 96px); z-index:4;
  }
  .caption-tag{
    display:inline-block; font-family:var(--font-ui); font-size:11.5px; font-weight:700;
    background:rgba(255,255,255,.16); backdrop-filter:blur(4px);
    padding:4px 10px; border-radius:99px; margin-bottom:8px;
  }
  .caption-text{ font-size:15px; font-weight:500; line-height:1.5; margin:0 0 6px; text-shadow:0 1px 6px rgba(0,0,0,.4); }
  .caption-hashtags{ font-family:var(--font-ui); font-size:12px; color:rgba(255,255,255,.8); margin:0 0 4px; }
  .caption-music{ font-family:var(--font-ui); font-size:11.5px; color:rgba(255,255,255,.7); margin:0; }

  /* ============================================================
     ボトムナビ（ホーム/AI/＋/記録/プロフィール共通）
  ============================================================ */
  .bottom-nav{
    position:absolute; left:0; right:0; bottom:0; z-index:10;
    padding:10px 20px calc(10px + var(--safe-bottom));
    display:flex; justify-content:space-around; align-items:center;
    background:linear-gradient(180deg, rgba(16,19,26,0) 0%, rgba(16,19,26,.55) 40%, rgba(16,19,26,.55) 100%);
  }
  .bottom-nav.solid-dark{ background:var(--ink); border-top:1px solid rgba(255,255,255,.08); }
  .nav-btn{ display:flex; flex-direction:column; align-items:center; gap:4px; color:rgba(255,255,255,.55); }
  .nav-btn.active{ color:var(--white); }
  .nav-icon svg{ width:22px; height:22px; }
  .nav-text{ font-family:var(--font-ui); font-size:10px; font-weight:600; }
  .nav-center-btn{
    width:46px; height:46px; border-radius:50%; margin-top:-16px;
    background:linear-gradient(135deg, var(--cta-from), var(--cta-to));
    display:flex; align-items:center; justify-content:center; color:#fff;
    box-shadow:0 6px 16px rgba(139,92,246,.5);
  }
  .nav-center-btn svg{ width:22px; height:22px; }

  /* ============================================================
     検索画面
  ============================================================ */
  #search-screen{ background:var(--paper); color:var(--ink-text); overflow-y:auto; padding-bottom:40px; }
  .search-header{ padding:calc(var(--safe-top) + 16px) 20px 6px; }
  .search-header-top{ margin-bottom:12px; }
  .back-btn{ width:34px; height:34px; border-radius:50%; background:rgba(255,255,255,.14); color:#fff; display:flex; align-items:center; justify-content:center; font-size:16px; }
  .back-btn.on-paper{ background:rgba(0,0,0,.06); color:var(--ink-text); }
  .search-header h1{ font-size:26px; margin:0 0 4px; font-weight:900; }
  .search-header p{ margin:0; color:var(--muted); font-family:var(--font-ui); font-size:13px; }

  .filter-group{ padding:18px 20px 4px; }
  .filter-label{ font-family:var(--font-ui); font-size:11px; font-weight:700; letter-spacing:.06em; color:var(--muted); text-transform:uppercase; margin-bottom:10px; }
  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    font-family:var(--font-ui); font-size:13px; font-weight:600; padding:9px 16px;
    border-radius:99px; background:var(--white); border:1px solid var(--paper-line); color:var(--ink-text);
    transition:all .18s ease;
  }
  .chip.active{ background:var(--ink); color:#fff; border-color:var(--ink); }

  .result-count{ padding:22px 20px 10px; font-family:var(--font-ui); font-size:13px; color:var(--muted); }
  .result-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:0 20px;
  }
  .result-card{ text-align:left; }
  .result-thumb{
    position:relative; aspect-ratio:9/13; border-radius:16px; overflow:hidden; margin-bottom:8px;
    display:flex; align-items:flex-end; padding:10px;
  }
  .result-thumb .badge{ position:absolute; top:8px; left:8px; }
  .result-duration{
    font-family:var(--font-ui); font-size:11px; font-weight:600; color:#fff;
    background:rgba(0,0,0,.4); padding:3px 7px; border-radius:99px; backdrop-filter:blur(4px);
  }
  .result-title{ font-size:13.5px; font-weight:700; margin:0 0 3px; line-height:1.35; }
  .result-meta{ font-family:var(--font-ui); font-size:11.5px; color:var(--muted); margin:0; }

  .empty-state{ text-align:center; padding:70px 30px; color:var(--muted); font-family:var(--font-ui); font-size:14px; line-height:1.7; }

  /* ============================================================
     ロング動画画面
  ============================================================ */
  #player-screen{ background:#000; }
  .player-header{
    position:absolute; top:0; left:0; right:0; z-index:5; padding:calc(var(--safe-top) + 14px) 16px 30px;
    background:linear-gradient(180deg, rgba(0,0,0,.65), rgba(0,0,0,0));
    display:flex; align-items:center; gap:12px;
  }
  .player-header-title{ font-family:var(--font-ui); font-size:13px; font-weight:600; color:#fff; opacity:.85; }
  #player-video{ width:100%; height:100%; object-fit:contain; background:#000; }
  .player-info{ position:absolute; left:0; right:0; bottom:0; padding:20px 20px calc(20px + var(--safe-bottom)); background:linear-gradient(0deg, rgba(0,0,0,.75), rgba(0,0,0,0)); }
  .player-info h2{ font-size:18px; margin:0 0 6px; }
  .player-info p{ margin:0; font-family:var(--font-ui); font-size:12.5px; color:rgba(255,255,255,.75); }

  /* ============================================================
     AI / 記録 / プロフィール / 投稿：準備中のプレースホルダー画面
  ============================================================ */
  .dark-screen{ background:var(--ink); color:#fff; display:flex; flex-direction:column; }
  .placeholder-wrap{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:0 40px;
  }
  .placeholder-icon{
    width:64px; height:64px; border-radius:50%; margin-bottom:18px;
    background:linear-gradient(135deg, var(--cta-from), var(--cta-to));
    display:flex; align-items:center; justify-content:center; color:#fff;
  }
  .placeholder-icon svg{ width:28px; height:28px; }
  .placeholder-title{ font-size:17px; font-weight:700; margin:0 0 8px; }
  .placeholder-sub{ font-family:var(--font-ui); font-size:13px; color:rgba(255,255,255,.6); margin:0; line-height:1.6; }

  /* ============================================================
     トースト（簡易な一時通知）
  ============================================================ */
  .toast{
    position:absolute; left:50%; bottom:calc(var(--safe-bottom) + 116px); z-index:50;
    transform:translate(-50%,8px);
    background:rgba(0,0,0,.82); color:#fff; font-family:var(--font-ui); font-size:12.5px;
    padding:9px 16px; border-radius:99px; opacity:0; pointer-events:none;
    transition:opacity .25s ease, transform .25s ease; white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:translate(-50%,0); }

  /* ============================================================
     PWAインストール案内バナー
  ============================================================ */
  #install-banner{
    position:absolute; left:14px; right:14px; z-index:20;
    bottom:calc(78px + var(--safe-bottom));
    background:var(--white); color:var(--ink-text); border-radius:16px;
    padding:13px 14px; display:none; align-items:center; gap:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
    font-family:var(--font-ui);
  }
  #install-banner.show{ display:flex; }
  #install-banner .ib-icon{ width:36px; height:36px; border-radius:9px; background:var(--ink); flex-shrink:0; display:flex; align-items:center; justify-content:center; color:var(--ember); font-weight:900; }
  #install-banner .ib-text{ flex:1; }
  #install-banner .ib-title{ font-size:13px; font-weight:700; margin:0 0 1px; }
  #install-banner .ib-sub{ font-size:11.5px; color:var(--muted); margin:0; }
  #install-banner button.ib-cta{ background:var(--ink); color:#fff; font-size:12px; font-weight:700; padding:8px 12px; border-radius:99px; }
  #install-banner button.ib-close{ color:var(--muted); font-size:18px; padding:4px; }

  @media (prefers-reduced-motion: reduce){
    .zone-meter-fill{ transition:none; }
    #feed-cta.pulse{ animation:none; }
  }
</style>
</head>
<body>

<div id="app">

  <!-- ============ ホーム画面（ショート動画フィード） ============ -->
  <section id="home-screen" class="screen active">
    <div id="feed"></div>

    <div id="feed-topbar">
      <button class="icon-btn" id="search-open-btn" aria-label="検索">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
      <button class="icon-btn" id="bell-btn" aria-label="通知">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <span class="notif-dot"></span>
      </button>
    </div>

    <button id="feed-cta">
      <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="6 3 20 12 6 21 6 3"/></svg>
      <span>勉強を始める</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
    </button>

    <div class="bottom-nav" data-active-nav="home"></div>

    <div id="install-banner">
      <div class="ib-icon">Z</div>
      <div class="ib-text">
        <p class="ib-title">ZoneNOWをホーム画面に追加</p>
        <p class="ib-sub">アプリのようにワンタップで起動できます</p>
      </div>
      <button class="ib-cta" id="install-btn">追加</button>
      <button class="ib-close" id="install-close">×</button>
    </div>
  </section>

  <!-- ============ 検索画面 ============ -->
  <section id="search-screen" class="screen">
    <div class="search-header">
      <div class="search-header-top">
        <button class="back-btn on-paper" id="search-back">←</button>
      </div>
      <h1>探す</h1>
      <p>学年・教科・単元から、いま必要な一本を見つける</p>
    </div>

    <div class="filter-group">
      <div class="filter-label">学年</div>
      <div class="chip-row" id="grade-chips"></div>
    </div>
    <div class="filter-group">
      <div class="filter-label">教科</div>
      <div class="chip-row" id="subject-chips"></div>
    </div>
    <div class="filter-group">
      <div class="filter-label">単元</div>
      <div class="chip-row" id="unit-chips"></div>
    </div>

    <div class="result-count" id="result-count"></div>
    <div class="result-grid" id="result-grid"></div>
    <div id="empty-state" class="empty-state" style="display:none;">条件に合う動画がまだありません。<br>条件を変えて探してみてください。</div>
  </section>

  <!-- ============ ロング動画画面 ============ -->
  <section id="player-screen" class="screen">
    <div class="player-header">
      <button class="back-btn" id="player-back">←</button>
      <span class="player-header-title">本編動画</span>
    </div>
    <video id="player-video" playsinline controls></video>
    <div class="player-info">
      <h2 id="player-title"></h2>
      <p id="player-meta"></p>
    </div>
  </section>

  <!-- ============ AI / 記録 / プロフィール / 投稿（準備中） ============ -->
  <section id="ai-screen" class="screen dark-screen">
    <div class="placeholder-wrap" data-placeholder="ai"></div>
    <div class="bottom-nav solid-dark" data-active-nav="ai"></div>
  </section>

  <section id="record-screen" class="screen dark-screen">
    <div class="placeholder-wrap" data-placeholder="record"></div>
    <div class="bottom-nav solid-dark" data-active-nav="record"></div>
  </section>

  <section id="profile-screen" class="screen dark-screen">
    <div class="placeholder-wrap" data-placeholder="profile"></div>
    <div class="bottom-nav solid-dark" data-active-nav="profile"></div>
  </section>

  <section id="create-screen" class="screen dark-screen">
    <div class="placeholder-wrap" data-placeholder="create"></div>
    <div class="bottom-nav solid-dark" data-active-nav="create"></div>
  </section>

</div>

<script>
/* ============================================================
   ◆ 動画データベース ◆
   ------------------------------------------------------------
   ここが「動画を追加する場所」です。他のコードには一切触れず、
   このリストに1件追加するだけで、検索・フィード両方に反映されます。
   subject / grade は下の SUBJECTS / GRADES と対応させてください。
   shortSrc / longSrc は今はデモ用の仮動画URLです。
   実際のコンテンツができたら、ここのURLだけ差し替えてください。
============================================================ */
const GRADES = [
  { id:'high1', label:'高校1年' },
  { id:'high2', label:'高校2年' },
  { id:'high3', label:'高校3年' },
];
const SUBJECTS = [
  { id:'math', label:'数学' },
  { id:'japanese', label:'国語' },
  { id:'english', label:'英語' },
];

// デモ用の仮動画(公開サンプル素材)。本番では自社動画URLに差し替えます。
const DEMO_SHORT = [
  "https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4",
  "https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4",
  "https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
  "https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4",
  "https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerMeltdowns.mp4",
];
const DEMO_LONG = [
  "https://storage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4",
  "https://storage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4",
  "https://storage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4",
];

function labelOf(list, id){ const f = list.find(x=>x.id===id); return f ? f.label : id; }

function icon(name){

/* ---- トースト：未実装機能に触れたときの簡易フィードバック ---- */
let toastTimer;
function showToast(msg){
  let el = document.getElementById('toast');
  if(!el){
    el = document.createElement('div');
    el.id = 'toast';
    el.className = 'toast';
    document.getElementById('app').appendChild(el);
  }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.classList.remove('show'), 1800);
}

/* ---- いいね・コメント・保存の表示件数(デモ用の疑似データ) ---- */
function demoCount(seed, min, max){
  let hash = 0;
  for(let i=0;i<seed.length;i++){ hash = (hash * 31 + seed.charCodeAt(i)) >>> 0; }
  return min + (hash % (max - min));
}
function formatCount(n){
  if(n >= 1000) return (n/1000).toFixed(1).replace(/\.0$/,'') + 'K';
  return String(n);
}

const screens = {
  home: document.getElementById('home-screen'),
  search: document.getElementById('search-screen'),
  player: document.getElementById('player-screen'),
  ai: document.getElementById('ai-screen'),
  record: document.getElementById('record-screen'),
  profile: document.getElementById('profile-screen'),
  create: document.getElementById('create-screen'),
};
function showScreen(name){
  Object.values(screens).forEach(s=>s.classList.remove('active'));
  screens[name].classList.add('active');
  document.querySelectorAll('[data-nav]').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.nav === name);
  });
  if(name !== 'player'){
    const pv = document.getElementById('player-video');
    pv.pause();
  }
  if(name !== 'home'){
    pauseAllShorts();
  }
}

// ---- ショート動画フィードの生成 ----
const feedEl = document.getElementById('feed');
let feedVideos = VIDEOS; // 検索結果からここへ差し込むことも可能な設計
let currentVisibleId = null; // 今画面に出ているショートのid(CTAから本編を開くときに使う)

function renderFeed(videos){
  feedEl.innerHTML = '';
  videos.forEach(v=>{
    const likes = demoCount(v.id + '-like', 800, 15000);
    const comments = demoCount(v.id + '-comment', 20, 600);
    const bookmarks = demoCount(v.id + '-bookmark', 100, 2000);

    const slide = document.createElement('div');
    slide.className = 'short-slide';
    slide.dataset.id = v.id;
    slide.innerHTML = `
      <div class="zone-meter"><div class="zone-meter-fill"></div></div>
      <video src="${v.short}" muted loop playsinline preload="metadata"></video>

      <div class="short-top">
        <span class="badge subject">${labelOf(SUBJECTS, v.subject)}</span>
        <span class="badge">${labelOf(GRADES, v.grade)}</span>
        <span class="badge">${v.unit}</span>
      </div>

      <div class="action-rail">
        <div class="avatar-wrap">
          <div class="avatar">${v.creator.charAt(0)}</div>
          <button class="follow-badge" data-role="follow">${icon('plus')}</button>
        </div>
        <button class="action-item" data-role="like">
          ${icon('heart')}
          <span class="action-count">${formatCount(likes)}</span>
        </button>
        <button class="action-item" data-role="comment">
          ${icon('comment')}
          <span class="action-count">${formatCount(comments)}</span>
        </button>
        <button class="action-item" data-role="bookmark">
          ${icon('bookmark')}
          <span class="action-count">${formatCount(bookmarks)}</span>
        </button>
        <button class="action-item" data-role="share">
          ${icon('share')}
          <span class="action-label">シェア</span>
        </button>
        <button class="action-item mute-item" data-role="mute">
          ${icon('volumeOff')}
        </button>
      </div>

      <div class="caption-block">
        <span class="caption-tag">#${v.unit}</span>
        <p class="caption-text">${v.title}</p>
        <p class="caption-hashtags">#勉強 #やる気 #高校生 ・ @${v.creator}</p>
        <p class="caption-music">♪ オリジナル楽曲 - ZoneNOW</p>
      </div>
    `;
    feedEl.appendChild(slide);
  });
  attachSlideEvents();
  observeSlides();
  if(videos[0]) currentVisibleId = videos[0].id;
}

function attachSlideEvents(){
  feedEl.querySelectorAll('.short-slide').forEach(slide=>{
    const id = slide.dataset.id;
    const video = slide.querySelector('video');

    // 音のON/OFF（フィード内のスライドをまたいで状態を引き継ぐ）
    const muteBtn = slide.querySelector('[data-role="mute"]');
    muteBtn.addEventListener('click', ()=>{
      video.muted = !video.muted;
      currentAudibleState = !video.muted;
      muteBtn.innerHTML = icon(video.muted ? 'volumeOff' : 'volume');
    });

    // いいね（ローカル表示のみ。サーバー保存は未実装）
    const likeBtn = slide.querySelector('[data-role="like"]');
    const likeCount = likeBtn.querySelector('.action-count');
    const baseLikes = demoCount(id + '-like', 800, 15000);
    let liked = false;
    likeBtn.addEventListener('click', ()=>{
      liked = !liked;
      likeBtn.classList.toggle('active', liked);
      likeCount.textContent = formatCount(baseLikes + (liked ? 1 : 0));
    });

    // 保存（ローカル表示のみ）
    const bookmarkBtn = slide.querySelector('[data-role="bookmark"]');
    const bookmarkCount = bookmarkBtn.querySelector('.action-count');
    const baseBookmarks = demoCount(id + '-bookmark', 100, 2000);
    let saved = false;
    bookmarkBtn.addEventListener('click', ()=>{
      saved = !saved;
      bookmarkBtn.classList.toggle('active', saved);
      bookmarkCount.textContent = formatCount(baseBookmarks + (saved ? 1 : 0));
    });

    // フォロー（ローカル表示のみ）
    const followBtn = slide.querySelector('[data-role="follow"]');
    followBtn.addEventListener('click', ()=>{
      const active = followBtn.classList.toggle('active');
      followBtn.innerHTML = icon(active ? 'check' : 'plus');
    });

    // コメントはまだ未実装
    slide.querySelector('[data-role="comment"]').addEventListener('click', ()=>{
      showToast('コメント機能は準備中です');
    });

    // シェア（対応端末はOSの共有シートを使用）
    slide.querySelector('[data-role="share"]').addEventListener('click', async ()=>{
      const v = VIDEOS.find(x=>x.id===id);
      if(navigator.share){
        try{ await navigator.share({ title: v.title, text: v.title, url: location.href }); }
        catch(e){ /* ユーザーがキャンセルした場合は何もしない */ }
      } else {
        showToast('この端末は共有に対応していません');
      }
    });
  });
}

// ---- スワイプで表示されている動画だけ再生する ----
let currentAudibleState = true; // ミュート状態をスライド間で引き継ぐ
function observeSlides(){
  const slides = feedEl.querySelectorAll('.short-slide');
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      const video = entry.target.querySelector('video');
      const meter = entry.target.querySelector('.zone-meter-fill');
      if(entry.isIntersecting && entry.intersectionRatio > 0.6){
        currentVisibleId = entry.target.dataset.id;
        video.currentTime = 0;
        video.play().catch(()=>{});
        video.muted = !currentAudibleState;
        const muteBtn = entry.target.querySelector('[data-role="mute"]');
        if(muteBtn) muteBtn.innerHTML = icon(video.muted ? 'volumeOff' : 'volume');
        runZoneMeter(video, meter);
      } else {
        video.pause();
        meter.style.transition = 'none';
        meter.style.width = '0%';
      }
    });
  }, { threshold:[0,0.6,1] });
  slides.forEach(s=>io.observe(s));
}

function runZoneMeter(video, meter){
  meter.style.transition = 'none';
  meter.style.width = '0%';
  const start = ()=>{
    const dur = video.duration && isFinite(video.duration) ? video.duration : 20;
    requestAnimationFrame(()=>{
      meter.style.transition = `width ${dur}s linear`;
      meter.style.width = '100%';
    });
  };
  if(video.readyState >= 1) start();
  else video.addEventListener('loadedmetadata', start, { once:true });

  video.onended = ()=>{
    const cta = document.getElementById('feed-cta');
    cta.classList.add('pulse');
    setTimeout(()=>cta.classList.remove('pulse'), 1200);
  };
}

function pauseAllShorts(){
  feedEl.querySelectorAll('video').forEach(v=>v.pause());
}

// ---- 検索画面 ----
let activeGrade = 'all';
let activeSubject = 'all';
let activeUnit = 'all';

function renderChips(){
  const gradeWrap = document.getElementById('grade-chips');
  const subjectWrap = document.getElementById('subject-chips');
  const unitWrap = document.getElementById('unit-chips');

  gradeWrap.innerHTML = chipHtml([{id:'all',label:'すべて'}, ...GRADES], activeGrade);
  subjectWrap.innerHTML = chipHtml([{id:'all',label:'すべて'}, ...SUBJECTS], activeSubject);

  const unitsForSubject = activeSubject === 'all'
    ? [...new Set(VIDEOS.map(v=>v.unit))]
    : [...new Set(VIDEOS.filter(v=>v.subject===activeSubject).map(v=>v.unit))];
  const unitOptions = [{id:'all', label:'すべて'}, ...unitsForSubject.map(u=>({id:u, label:u}))];
  unitWrap.innerHTML = chipHtml(unitOptions, activeUnit);

  gradeWrap.querySelectorAll('.chip').forEach(c=>c.addEventListener('click', ()=>{ activeGrade=c.dataset.id; renderChips(); renderResults(); }));
  subjectWrap.querySelectorAll('.chip').forEach(c=>c.addEventListener('click', ()=>{ activeSubject=c.dataset.id; activeUnit='all'; renderChips(); renderResults(); }));
  unitWrap.querySelectorAll('.chip').forEach(c=>c.addEventListener('click', ()=>{ activeUnit=c.dataset.id; renderChips(); renderResults(); }));
}
function chipHtml(list, activeId){
  return list.map(item=>`<button class="chip ${item.id===activeId?'active':''}" data-id="${item.id}">${item.label}</button>`).join('');
}

function filteredVideos(){
  return VIDEOS.filter(v=>
    (activeGrade==='all' || v.grade===activeGrade) &&
    (activeSubject==='all' || v.subject===activeSubject) &&
    (activeUnit==='all' || v.unit===activeUnit)
  );
}

const gradientBySubject = {
  math: 'linear-gradient(160deg, #2B2E63, #10131A)',
  japanese: 'linear-gradient(160deg, #7A3B2E, #10131A)',
  english: 'linear-gradient(160deg, #1E5C55, #10131A)',
};

function renderResults(){
  const results = filteredVideos();
  document.getElementById('result-count').textContent = `${results.length}件の動画`;
  const grid = document.getElementById('result-grid');
  const empty = document.getElementById('empty-state');
  grid.style.display = results.length ? 'grid' : 'none';
  empty.style.display = results.length ? 'none' : 'block';

  grid.innerHTML = results.map(v=>`
    <button class="result-card" data-id="${v.id}">
      <div class="result-thumb" style="background:${gradientBySubject[v.subject]}">
        <span class="badge">${labelOf(GRADES, v.grade)}</span>
        <span class="result-duration">${v.duration}秒</span>
      </div>
      <p class="result-title">${v.title}</p>
      <p class="result-meta">${labelOf(SUBJECTS, v.subject)} ・ ${v.unit}</p>
    </button>
  `).join('');

  grid.querySelectorAll('.result-card').forEach(card=>{
    card.addEventListener('click', ()=> jumpToShort(card.dataset.id));
  });
}

function jumpToShort(id){
  showScreen('home');
  const target = feedEl.querySelector(`.short-slide[data-id="${id}"]`);
  if(target) target.scrollIntoView({ behavior:'instant', block:'start' });
}

document.getElementById('search-back').addEventListener('click', ()=> showScreen('home'));

renderChips();
renderResults();

function openPlayer(id){
  const v = VIDEOS.find(x=>x.id===id);
  if(!v) return;
  const pv = document.getElementById('player-video');
  pv.src = v.long;
  document.getElementById('player-title').textContent = v.title + '(本編)';
  document.getElementById('player-meta').textContent = `${labelOf(SUBJECTS, v.subject)} ・ ${labelOf(GRADES, v.grade)} ・ ${v.unit} ・ ${v.creator}`;
  showScreen('player');
  pv.play().catch(()=>{});
}
