<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>ZoneNOW Swipe MVP</title>

<!-- ▼ PWA（スマホの「ホーム画面に追加」でアプリのように使える仕組み）のための設定 -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#10131A" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ZoneNOW" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  /* ============================================================
     デザイントークン（色・フォント・余白のルールをここに集約）
     この値だけ変えれば、アプリ全体の雰囲気を調整できます。
  ============================================================ */
  :root{
    --bg:#10131A;           /* ほぼ黒に近いネイビー（背景色） */
    --card:#1A1E29;         /* カードなど、背景より少し明るい面 */
    --white:#FFFFFF;
    --muted:#9497A6;        /* 補足テキストの薄いグレー */
    --ember:#FF5A36;        /* アクセントカラー（やる気の火種） */
    --ember-soft:#FF8A6B;
    --mint:#33D6A6;         /* Zoneメーター的な要素に使うミント */
    --font-display:'Zen Kaku Gothic New', sans-serif; /* 見出し・本文用 */
    --font-ui:'Inter', 'Zen Kaku Gothic New', sans-serif; /* 数字・UIラベル用 */
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; overscroll-behavior:none;
    height:100%; height:100dvh; /* dvhに対応するブラウザでは、アドレスバーの出没に強い高さ指定になる */
    font-family:var(--font-display); background:var(--bg); color:var(--white);
  }
  button{ font-family:inherit; border:none; background:none; cursor:pointer; -webkit-user-select:none; user-select:none; }

  #app{ position:fixed; inset:0; overflow:hidden; }

  /* ============================================================
     画面切り替えの共通ルール
     「.screen」を持つ要素は全て重ねて置いておき、
     「.active」がついたものだけを表示する、というシンプルな仕組み。
  ============================================================ */
  .screen{
    position:absolute; inset:0; opacity:0; pointer-events:none;
    transition:opacity .3s ease; display:flex; align-items:center; justify-content:center;
  }
  .screen.active{ opacity:1; pointer-events:auto; }

  /* ============================================================
     フィード画面（全画面のショート動画スワイプ）
  ============================================================ */
  #screen-feed{ background:#000; display:block; }

  /* 動画プレイヤーを2台（A・B）重ねて置いておく仕組み。
     詳しい理由はJS側のコメント（「二重の受け皿」）を参照。
     今表に出ている方だけ opacity:1 になる。 */
  .player-wrap{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:#000; opacity:0; z-index:0; transition:opacity .12s linear;
  }
  .player-wrap.active-player{ opacity:1; z-index:1; }
  /* YouTube Shortsと同じ感覚で、画面いっぱい(端から端まで)に動画を表示する。
     動画ごとの縦横比の違い（16:9 / 9:16 など）は、YouTube側のプレイヤーが
     自動でレターボックス（余白の黒帯）を付けて調整してくれる。 */
  .player-wrap iframe{ width:100%; height:100%; border:0; }

  /* スワイプ・タップを検知するための透明な層。
     YouTubeのiframeは別サイト（外部）の部品なので、
     その上に自分の透明な板を重ねてジェスチャーを受け取ります。 */
  #swipe-layer{
    position:absolute; inset:0; z-index:5; touch-action:none;
  }

  .top-controls{
    position:absolute; top:calc(var(--safe-top) + 14px); right:14px; z-index:10;
    display:flex; gap:10px;
  }
  .icon-btn{
    width:42px; height:42px; border-radius:50%;
    background:rgba(16,19,26,.55); backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center; font-size:18px;
  }

  .swipe-hint{
    position:absolute; left:0; right:0; bottom:calc(var(--safe-bottom) + 18px);
    text-align:center; font-family:var(--font-ui); font-size:12px; color:var(--muted);
    z-index:8; pointer-events:none; letter-spacing:.02em;
  }

  /* 画面の端に常に置いておく「勉強する」ボタン。
     割り込み画面を待たなくても、いつでも自分から学習に入れるようにするための入口。
     動画の邪魔にならないよう、ミュート/ログボタンと対になる左上の隅に、
     同じ大きさの丸アイコンボタンとして置いている（大きなピル型だと動画に被って邪魔だったため）。 */
  .quick-study-btn{
    position:fixed; top:calc(var(--safe-top) + 14px); left:14px; z-index:20;
    background:rgba(255,90,54,.94);
    transition:transform .15s ease;
  }
  .quick-study-btn:active{ transform:scale(.9); }

  #feed-loading{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:12px; color:var(--muted); font-family:var(--font-ui);
    font-size:14px; z-index:6; text-align:center; padding:0 32px; background:#000;
  }
  #feed-loading.hidden{ display:none; }

  /* ============================================================
     カード共通スタイル（啓発プロンプト／タイマー／完了画面）
  ============================================================ */
  .card{
    width:min(420px, 86vw);
    background:var(--card);
    border-radius:24px;
    padding:36px 28px calc(28px + var(--safe-bottom));
    text-align:center;
  }
  .card h1{
    margin:0 0 10px; font-size:22px; font-weight:700; line-height:1.4;
  }
  .card .sub{
    margin:0 0 10px; font-size:14px; color:var(--muted); line-height:1.7;
  }
  .card .sub:last-of-type{ margin-bottom:28px; }
  .emoji{ font-size:40px; margin:0 0 14px; }

  .btn{
    display:block; width:100%; padding:16px; border-radius:14px;
    font-family:var(--font-ui); font-size:16px; font-weight:600;
    margin-bottom:12px; transition:transform .15s ease, opacity .15s ease;
  }
  .btn:active{ transform:scale(.97); }
  .btn-primary{ background:var(--ember); color:var(--white); }
  .btn-ghost{ background:rgba(255,255,255,.08); color:var(--white); }
  .btn-text{ background:none; color:var(--muted); font-size:13px; padding:8px; margin-bottom:0; }

  /* ============================================================
     啓発プロンプト画面（割り込み画面）
  ============================================================ */
  #screen-prompt{ background:rgba(16,19,26,.94); backdrop-filter:blur(10px); }

  /* ============================================================
     学習タイマー画面
  ============================================================ */
  .duration-select{ display:flex; gap:10px; margin-bottom:26px; }
  .duration-btn{
    flex:1; padding:14px 0; border-radius:12px; background:rgba(255,255,255,.06);
    color:var(--white); font-family:var(--font-ui); font-size:15px; font-weight:600;
  }
  .duration-btn.selected{ background:var(--ember); }

  .timer-display{
    font-family:var(--font-ui); font-size:56px; font-weight:700; letter-spacing:.02em;
    margin-bottom:14px; font-variant-numeric:tabular-nums;
  }
  /* タイマーの進み具合（目標時間に対してどれだけ経過したか）を示すバー。
     Zoneメーターの発想（エンバー→ミントのグラデーション）を
     「集中の深まり」を表す演出として転用しています。 */
  .timer-bar{
    height:6px; border-radius:99px; background:rgba(255,255,255,.1);
    overflow:hidden; margin-bottom:28px;
  }
  .timer-bar-fill{
    height:100%; width:0%; border-radius:99px;
    background:linear-gradient(90deg, var(--ember), var(--mint));
    transition:width 1s linear;
  }

  /* ============================================================
     完了画面
  ============================================================ */
  #screen-done .emoji{ font-size:46px; }
  #done-today-time{ color:var(--mint); font-family:var(--font-ui); font-weight:600; }

  /* ============================================================
     初回訪問時のみ表示する「ホーム画面に追加」バナー
  ============================================================ */
  #pwa-banner{
    position:fixed; left:14px; right:14px; bottom:calc(var(--safe-bottom) + 14px);
    z-index:50; background:var(--card); border-radius:16px; padding:16px 18px;
    display:flex; align-items:center; gap:12px;
    box-shadow:0 8px 30px rgba(0,0,0,.4);
    transform:translateY(120%); transition:transform .35s ease;
  }
  #pwa-banner.visible{ transform:translateY(0); }
  #pwa-banner p{
    margin:0; font-size:13px; line-height:1.6; color:var(--white); font-family:var(--font-ui);
    flex:1;
  }
  #pwa-banner button{
    flex-shrink:0; width:34px; height:34px; border-radius:50%;
    background:rgba(255,255,255,.1); color:var(--white); font-size:16px;
  }
</style>
</head>
<body>

<div id="app">

  <!-- ============================================================
       ① フィード画面：全画面のショート動画スワイプ
  ============================================================ -->
  <section id="screen-feed" class="screen active">
    <!-- 動画プレイヤーを2台重ねて置く。表に出ている方（active-player）だけ見える。 -->
    <div id="yt-player-wrap-a" class="player-wrap active-player">
      <div id="yt-player-a"></div>
    </div>
    <div id="yt-player-wrap-b" class="player-wrap">
      <div id="yt-player-b"></div>
    </div>

    <div id="feed-loading">動画を読み込んでいます…</div>

    <!-- スワイプ・タップ検知用の透明レイヤー -->
    <div id="swipe-layer"></div>

    <div class="top-controls">
      <button id="btn-mute" class="icon-btn" aria-label="ミュート切り替え">🔇</button>
      <button id="btn-log" class="icon-btn" aria-label="検証ログを見る">📊</button>
    </div>

    <!-- 画面の端に常に置いておく「勉強する」ボタン。いつでも自分から学習に入れる。 -->
    <button id="btn-quick-study" class="icon-btn quick-study-btn" aria-label="勉強を始める">📚</button>

    <p class="swipe-hint">↑ 上にスワイプで次の動画　/　タップで音ON・OFF</p>
  </section>

  <!-- ============================================================
       ② 啓発プロンプト画面（一定本数ごとに割り込み表示）
  ============================================================ -->
  <section id="screen-prompt" class="screen">
    <div class="card">
      <p class="emoji">🔥</p>
      <h1>そろそろ勉強しませんか？</h1>
      <p class="sub">動画を見る手を止めて、少しだけ机に向かってみましょう。</p>
      <button id="btn-start-study" class="btn btn-primary">はい、始める</button>
      <button id="btn-keep-watching" class="btn btn-ghost">まだ動画を見る</button>
    </div>
  </section>

  <!-- ============================================================
       ③ 学習タイマー画面
  ============================================================ -->
  <section id="screen-timer" class="screen">
    <div class="card">
      <h1>学習タイマー</h1>
      <p class="sub">時間を選んでスタートしましょう</p>

      <div class="duration-select">
        <button class="duration-btn" data-min="5">5分</button>
        <button class="duration-btn selected" data-min="15">15分</button>
        <button class="duration-btn" data-min="25">25分</button>
      </div>

      <div class="timer-display" id="timer-display">00:00</div>
      <div class="timer-bar"><div class="timer-bar-fill" id="timer-bar-fill"></div></div>

      <button id="btn-timer-start" class="btn btn-primary">スタート</button>
      <button id="btn-timer-reset" class="btn btn-ghost">リセット</button>
      <button id="btn-timer-back" class="btn btn-text">動画に戻る</button>
    </div>
  </section>

  <!-- ============================================================
       ④ 完了画面
  ============================================================ -->
  <section id="screen-done" class="screen">
    <div class="card">
      <p class="emoji">🎉</p>
      <h1>おつかれさまでした</h1>
      <p class="sub">今日も一歩、前進しましたね。</p>
      <p class="sub" id="done-today-time"></p>
      <button id="btn-done-home" class="btn btn-primary">ホームに戻る</button>
    </div>
  </section>

  <!-- ============================================================
       ⑤ 初回訪問時だけ出す「ホーム画面に追加」バナー
  ============================================================ -->
  <div id="pwa-banner">
    <p id="pwa-banner-text"></p>
    <button id="btn-banner-close" aria-label="閉じる">✕</button>
  </div>

</div>

<script>
/* ============================================================
   ⚙️ 設定エリア（検証中はここの数値だけ触ればOK）
   ------------------------------------------------------------
   PLAYLIST_ID                : 使いたいYouTube再生リストのID。
                                 再生リストのURLの「list=」の後ろの文字列です。
                                 例）https://www.youtube.com/playlist?list=PLxxxxxxxxxxxxxxxx
                                                                          ↑ここ
   FIRST_PROMPT_AFTER         : 最初に啓発プロンプトを出すタイミング（何本目の動画の後か）
   PROMPT_INTERVAL_AFTER_FIRST: 2回目以降、何本ごとにプロンプトを出すか
============================================================ */
const CONFIG = {
  // ⚠️ 教えてもらったURLの list= の値をそのまま設定しています。
  //    通常の再生リストIDはもう少し長い文字列（30文字前後）のことが多いので、
  //    もし動画が読み込めない場合はYouTubeアプリの「共有」→リンクをコピーで
  //    フルのURLを取り直し、list= の後ろの文字列に置き換えてください。
  PLAYLIST_ID: "PLToIvTt0MLnw",
  FIRST_PROMPT_AFTER: 20,        // 20本見たら最初のプロンプト
  PROMPT_INTERVAL_AFTER_FIRST: 10 // その後は10本ごとにプロンプト
};

/* ============================================================
   画面切り替えの小さなヘルパー
============================================================ */
function showScreen(id){
  document.querySelectorAll(".screen").forEach((el) => el.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* ============================================================
   1日の勉強時間の記録
   ------------------------------------------------------------
   localStorageに「日付ごとの合計勉強秒数」を保存しておく、簡易的な記録機能。
   ページを閉じても、翌日以降もブラウザに残り続けます。
============================================================ */
const STUDY_LOG_KEY = "zonenow_mvp_study_log";

function getTodayKey(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

function loadStudyLog(){
  try {
    return JSON.parse(localStorage.getItem(STUDY_LOG_KEY)) || {};
  } catch (e){
    return {}; // 保存データが壊れていた場合は空として扱う
  }
}

function addStudyTime(seconds){
  const log = loadStudyLog();
  const key = getTodayKey();
  log[key] = (log[key] || 0) + seconds;
  localStorage.setItem(STUDY_LOG_KEY, JSON.stringify(log));
}

function getTodayStudySeconds(){
  const log = loadStudyLog();
  return log[getTodayKey()] || 0;
}

function formatStudyDuration(totalSeconds){
  const totalMinutes = Math.floor(totalSeconds / 60);
  const hours = Math.floor(totalMinutes / 60);
  const minutes = totalMinutes % 60;
  if (hours > 0) return `${hours}時間${minutes}分`;
  return `${minutes}分`;
}

/* ============================================================
   検証ログ（かんたんな計測）
   表示回数などはページを再読み込みすると0に戻る簡易カウンター。
   勉強時間の記録だけはlocalStorageに残るので、再読み込みしても消えません。
============================================================ */
const verificationLog = {
  promptShownCount: 0, // 啓発プロンプトを表示した回数
  yesClickCount: 0     // 「はい、始める」を押した回数
};

document.getElementById("btn-log").addEventListener("click", () => {
  alert(
    "【検証ログ】\n" +
    "啓発プロンプトの表示回数: " + verificationLog.promptShownCount + "回\n" +
    "「はい、始める」を押した回数: " + verificationLog.yesClickCount + "回\n" +
    "今日の合計勉強時間: " + formatStudyDuration(getTodayStudySeconds()) + "\n\n" +
    "※表示回数・クリック回数はページ再読み込みでリセットされます（勉強時間の記録は残ります）。"
  );
});

/* ============================================================
   ① YouTube IFrame Player API まわり
   ------------------------------------------------------------
   YouTube側が用意しているスクリプト（下の<script>タグ）を読み込むと、
   自動的に「onYouTubeIframeAPIReady」という名前の関数が呼ばれます。

   ★動画をスムーズに切り替えるための工夫（二重の受け皿）★
   プレイヤーを1台だけで使うと、次の動画に切り替えるたびに
   「読み込み待ち」が発生してカクつきます。
   そこで、プレイヤーを2台(A・B)用意しておき、
   　・今見えている方（表）を再生
   　・もう片方（裏）には、次に見る動画をあらかじめこっそり読み込んでおく
   という「先読み」をしておくことで、スワイプした瞬間には
   もう準備が終わっている状態を作り、切り替えを滑らかにしています。
============================================================ */
const players = { a: null, b: null }; // 2台のプレイヤー
let activeKey = "a";     // 今、表に出ているのはどちらか
let videoIds = [];       // 再生リストに入っている動画IDの並び
let currentIndex = 0;    // 今何本目を再生しているか
let watchedCount = 0;    // ここまでに視聴を終えた（または送り飛ばした）動画の本数
let isMuted = true;
let cameFromPrompt = false; // タイマー画面に「啓発プロンプト経由」で来たかどうか

function otherKey(key){ return key === "a" ? "b" : "a"; }
function getActivePlayer(){ return players[activeKey]; }

function onYouTubeIframeAPIReady(){
  players.a = new YT.Player("yt-player-a", {
    playerVars: {
      listType: "playlist",
      list: CONFIG.PLAYLIST_ID,
      autoplay: 1,
      mute: 1,          // ブラウザの自動再生ポリシー上、最初はミュート必須
      controls: 0,       // YouTube標準のコントロールは消し、自前のUIだけにする
      disablekb: 1,
      fs: 0,
      playsinline: 1,    // iPhoneでも画面いっぱいの自動再生を許可する設定
      rel: 0,
      modestbranding: 1,
      iv_load_policy: 3
    },
    events: {
      onReady: onPrimaryPlayerReady,
      onStateChange: onPlayerStateChange,
      onError: onPlayerError
    }
  });
}

function onPrimaryPlayerReady(){
  document.getElementById("feed-loading").classList.add("hidden");

  // 再生リストの中身（動画IDの並び）と、今何本目かを取得する
  videoIds = players.a.getPlaylist() || [];
  currentIndex = players.a.getPlaylistIndex() || 0;
  activeKey = "a";
  applyMuteState();

  // 裏側担当のプレイヤーBを用意する（先読み専用）
  players.b = new YT.Player("yt-player-b", {
    playerVars: {
      mute: 1, controls: 0, disablekb: 1, fs: 0,
      playsinline: 1, rel: 0, modestbranding: 1, iv_load_policy: 3
    },
    events: {
      onReady: preloadStandbyVideo,
      onStateChange: onPlayerStateChange,
      onError: onPlayerError
    }
  });
}

// 裏側のプレイヤーに、次に見る動画をこっそり読み込んでおく（再生はしない＝cue）
function preloadStandbyVideo(){
  const standby = players[otherKey(activeKey)];
  if (!standby || typeof standby.cueVideoById !== "function" || videoIds.length === 0) return;
  const nextIndex = (currentIndex + 1) % videoIds.length;
  standby.cueVideoById(videoIds[nextIndex]);
}

function onPlayerError(){
  document.getElementById("feed-loading").classList.remove("hidden");
  document.getElementById("feed-loading").textContent =
    "動画を読み込めませんでした。CONFIG.PLAYLIST_ID が正しい再生リストIDになっているか確認してください。";
}

// プレイヤーの状態が変わるたびに呼ばれる（再生中・一時停止・終了、など）
function onPlayerStateChange(event){
  // 今表に出ているプレイヤー以外（＝裏で先読み中のプレイヤー）の変化は無視する
  const firedKey = (event.target === players.a) ? "a" : "b";
  if (firedKey !== activeKey) return;

  if (event.data === YT.PlayerState.ENDED){
    handleVideoAdvance();
  }
}

/* ============================================================
   動画が1本終わった／送られたときの共通処理
   ------------------------------------------------------------
   「動画の自然終了」と「上スワイプでの送り」を同じ扱いにしています。
   （どちらも「その動画は見終えた」とみなすのが、
     もっともシンプルに仮説検証を進められると判断したためです）
============================================================ */
function handleVideoAdvance(){
  watchedCount++;

  if (shouldShowPrompt(watchedCount)){
    showPromptScreen();
  } else {
    advanceToStandby();
  }
}

// 「今、啓発プロンプトを出すべきタイミングか」を判定する
// 例）FIRST_PROMPT_AFTER=20, INTERVAL=10 なら → 20本目、30本目、40本目…で表示
function shouldShowPrompt(count){
  if (count < CONFIG.FIRST_PROMPT_AFTER) return false;
  if (count === CONFIG.FIRST_PROMPT_AFTER) return true;
  return (count - CONFIG.FIRST_PROMPT_AFTER) % CONFIG.PROMPT_INTERVAL_AFTER_FIRST === 0;
}

function showPromptScreen(){
  const active = getActivePlayer();
  if (active && typeof active.pauseVideo === "function") active.pauseVideo();
  verificationLog.promptShownCount++;
  showScreen("screen-prompt");
}

// 裏で先読みしておいた動画に、表と裏を入れ替えながら切り替える（＝スムーズな次送り）
function advanceToStandby(){
  if (videoIds.length < 2 || !players.b){
    // 先読みの仕組みがまだ使えない場合は、普通の次送りにフォールバック
    const active = getActivePlayer();
    if (active && typeof active.nextVideo === "function") active.nextVideo();
    return;
  }

  const oldKey = activeKey;
  const oldPlayer = players[oldKey];
  if (oldPlayer && typeof oldPlayer.pauseVideo === "function") oldPlayer.pauseVideo();

  // 表と裏を入れ替える
  activeKey = otherKey(oldKey);
  currentIndex = (currentIndex + 1) % videoIds.length;

  applyMuteState();
  const newActive = getActivePlayer();
  if (newActive && typeof newActive.playVideo === "function") newActive.playVideo();
  swapPlayerVisibility();

  // 裏に回った方（さっきまで表だった方）に、次の“次”の動画を仕込んでおく
  const followUpIndex = (currentIndex + 1) % videoIds.length;
  if (oldPlayer && typeof oldPlayer.cueVideoById === "function" && videoIds[followUpIndex]){
    oldPlayer.cueVideoById(videoIds[followUpIndex]);
  }
}

function swapPlayerVisibility(){
  document.getElementById("yt-player-wrap-a").classList.toggle("active-player", activeKey === "a");
  document.getElementById("yt-player-wrap-b").classList.toggle("active-player", activeKey === "b");
}

// 下スワイプ＝前の動画に戻る（これは「見終えた」扱いにはしないので、プロンプト判定はしない）
function goToPreviousVideo(){
  if (videoIds.length === 0){
    const active = getActivePlayer();
    if (active && typeof active.previousVideo === "function") active.previousVideo();
    return;
  }
  currentIndex = (currentIndex - 1 + videoIds.length) % videoIds.length;
  const active = getActivePlayer();
  if (active && typeof active.loadVideoById === "function"){
    active.loadVideoById(videoIds[currentIndex]);
    applyMuteState();
  }
  preloadStandbyVideo(); // 裏側の先読み内容も、新しい「次」の動画に更新しておく
}

function applyMuteState(){
  const p = getActivePlayer();
  if (!p) return;
  if (isMuted && typeof p.mute === "function") p.mute();
  else if (!isMuted && typeof p.unMute === "function") p.unMute();
}

/* ============================================================
   フィード画面のジェスチャー操作（スワイプ・タップ）
   ------------------------------------------------------------
   YouTubeのiframeは外部サイトの部品なので、直接タッチイベントを
   取れません。そこで透明な板（#swipe-layer）を上に重ねて、
   そこでタッチの動きを判定しています。
============================================================ */
const swipeLayer = document.getElementById("swipe-layer");
let touchStartY = 0;
let touchStartX = 0;
let touchStartTime = 0;

swipeLayer.addEventListener("touchstart", (e) => {
  touchStartY = e.touches[0].clientY;
  touchStartX = e.touches[0].clientX;
  touchStartTime = Date.now();
}, { passive: true });

swipeLayer.addEventListener("touchend", (e) => {
  if (!getActivePlayer()) return;
  const touchEndY = e.changedTouches[0].clientY;
  const touchEndX = e.changedTouches[0].clientX;
  const deltaY = touchEndY - touchStartY;
  const deltaX = touchEndX - touchStartX;
  const elapsed = Date.now() - touchStartTime;

  const isMostlyVertical = Math.abs(deltaY) > Math.abs(deltaX);
  const SWIPE_THRESHOLD = 60; // これ以上動いたら「スワイプ」とみなす距離(px)
  const TAP_THRESHOLD = 12;   // これ以下の移動なら「タップ」とみなす距離(px)

  if (isMostlyVertical && Math.abs(deltaY) > SWIPE_THRESHOLD){
    if (deltaY < 0){
      // 上スワイプ → 次の動画へ
      handleVideoAdvance();
    } else {
      // 下スワイプ → 前の動画へ
      goToPreviousVideo();
    }
  } else if (Math.abs(deltaY) < TAP_THRESHOLD && Math.abs(deltaX) < TAP_THRESHOLD && elapsed < 300){
    // 軽いタップ → ミュートのON/OFF切り替え
    toggleMute();
  }
}, { passive: true });

// マウス操作（PCでの動作確認用）にもかんたんに対応
document.getElementById("btn-mute").addEventListener("click", toggleMute);

function toggleMute(){
  if (!getActivePlayer()) return;
  isMuted = !isMuted;
  applyMuteState();
  document.getElementById("btn-mute").textContent = isMuted ? "🔇" : "🔊";
}

/* ============================================================
   画面の端に常に置いてある「勉強する」ボタン
   ------------------------------------------------------------
   啓発プロンプトを待たなくても、自分の意思でいつでも学習に入れる入口。
   （見ていた動画は終わっていないので、戻ってきたら続きから再生する）
============================================================ */
document.getElementById("btn-quick-study").addEventListener("click", () => {
  const active = getActivePlayer();
  if (active && typeof active.pauseVideo === "function") active.pauseVideo();
  cameFromPrompt = false;
  showScreen("screen-timer");
});

/* ============================================================
   ② 啓発プロンプト画面のボタン操作
============================================================ */
document.getElementById("btn-start-study").addEventListener("click", () => {
  verificationLog.yesClickCount++;
  cameFromPrompt = true; // 動画は見終わっているので、戻るときは次の動画から再開する
  showScreen("screen-timer");
});

document.getElementById("btn-keep-watching").addEventListener("click", () => {
  advanceToStandby();
  showScreen("screen-feed");
});

/* ============================================================
   ③ 学習タイマー（カウントアップ方式）
   ------------------------------------------------------------
   「残り時間がどんどん減っていく」プレッシャーではなく、
   「頑張った時間がどんどん増えていく」達成感を見せたいので、
   0:00から目標時間に向かって数字が増えていく方式にしています。
   目標（5/15/25分）に到達したら自動的に完了扱いになります。
============================================================ */
let timerTargetSec = 15 * 60;  // 目標時間（選んだ分数、秒に変換）
let timerElapsedSec = 0;       // ここまで経過した時間（0から増えていく）
let timerIntervalId = null;

const timerDisplay = document.getElementById("timer-display");
const timerBarFill = document.getElementById("timer-bar-fill");
const durationButtons = document.querySelectorAll(".duration-btn");

durationButtons.forEach((btn) => {
  btn.addEventListener("click", () => {
    if (timerIntervalId) return; // タイマー動作中は目標を変更させない
    durationButtons.forEach((b) => b.classList.remove("selected"));
    btn.classList.add("selected");
    timerTargetSec = Number(btn.dataset.min) * 60;
    timerElapsedSec = 0;
    renderTimer();
  });
});

function renderTimer(){
  const min = Math.floor(timerElapsedSec / 60).toString().padStart(2, "0");
  const sec = (timerElapsedSec % 60).toString().padStart(2, "0");
  timerDisplay.textContent = `${min}:${sec}`;

  const progress = timerElapsedSec / timerTargetSec;
  timerBarFill.style.width = (Math.min(progress, 1) * 100) + "%";
}

document.getElementById("btn-timer-start").addEventListener("click", () => {
  if (timerIntervalId) return; // すでに動いていたら何もしない
  timerIntervalId = setInterval(() => {
    timerElapsedSec++;
    renderTimer();
    if (timerElapsedSec >= timerTargetSec){
      clearInterval(timerIntervalId);
      timerIntervalId = null;

      // 目標時間ぶん、今日の勉強時間として記録する
      addStudyTime(timerTargetSec);
      document.getElementById("done-today-time").textContent =
        "今日の合計勉強時間: " + formatStudyDuration(getTodayStudySeconds());

      showScreen("screen-done");
    }
  }, 1000);
});

document.getElementById("btn-timer-reset").addEventListener("click", () => {
  clearInterval(timerIntervalId);
  timerIntervalId = null;
  timerElapsedSec = 0;
  renderTimer();
});

document.getElementById("btn-timer-back").addEventListener("click", () => {
  resumeFeedFromTimer();
});

/* ============================================================
   ④ 完了画面 → ホームへ戻る
============================================================ */
document.getElementById("btn-done-home").addEventListener("click", () => {
  resumeFeedFromTimer();
});

// タイマー画面／完了画面から、フィード画面に戻るときの共通処理
function resumeFeedFromTimer(){
  clearInterval(timerIntervalId);
  timerIntervalId = null;
  timerElapsedSec = 0;
  renderTimer();
  showScreen("screen-feed");

  if (cameFromPrompt){
    // 啓発プロンプト経由で来た場合、その動画はもう見終わっているので次の動画に進む
    advanceToStandby();
  } else {
    // 「勉強するボタン」から直接来た場合、見ていた動画の続きを再生する
    const active = getActivePlayer();
    if (active && typeof active.playVideo === "function") active.playVideo();
  }
  cameFromPrompt = false;
}

/* ============================================================
   ⑤ 初回訪問時だけ「ホーム画面に追加」バナーを出す
   ------------------------------------------------------------
   localStorageは、ブラウザに小さなデータを保存しておける仕組みです。
   一度「訪問済み」と記録しておけば、次回以降はバナーを出しません。
============================================================ */
(function setupFirstVisitBanner(){
  const STORAGE_KEY = "zonenow_mvp_visited";
  const alreadyVisited = localStorage.getItem(STORAGE_KEY);

  if (alreadyVisited) return; // 2回目以降は何もしない

  // 端末に応じて、案内文を少しだけ変える
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const message = isIOS
    ? "ホーム画面に追加すると、アプリのようにすぐ開けます。共有ボタン（□に↑）→「ホーム画面に追加」を選んでください。"
    : "ホーム画面に追加すると、アプリのようにすぐ開けます。メニュー（⋮）→「ホーム画面に追加」または「インストール」を選んでください。";

  document.getElementById("pwa-banner-text").textContent = message;

  // 少し遅らせて表示（開いた瞬間に動画へ集中してもらうため）
  setTimeout(() => {
    document.getElementById("pwa-banner").classList.add("visible");
  }, 1500);

  // 「初めて開いた」という記録は、この時点でもう残しておく
  // （バナーを閉じなくても、次回以降は表示されないようにするため）
  localStorage.setItem(STORAGE_KEY, "true");
})();

document.getElementById("btn-banner-close").addEventListener("click", () => {
  document.getElementById("pwa-banner").classList.remove("visible");
});

/* ============================================================
   ⑥ Service Workerの登録（PWA対応に必須）
============================================================ */
if ("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch((err) => {
      console.error("Service Workerの登録に失敗しました", err);
    });
  });
}
