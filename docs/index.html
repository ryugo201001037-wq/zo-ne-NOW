<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>ZoneNOW Swipe MVP</title>

<!-- ▼ PWA（スマホの「ホーム画面に追加」でアプリのように使える仕組み）のための設定 -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#10131A" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ZoneNOW" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- 動画のラグを少しでも減らすため、YouTube側のドメインに事前接続しておく -->
<link rel="preconnect" href="https://www.youtube.com">
<link rel="preconnect" href="https://i.ytimg.com">
<link rel="preconnect" href="https://s.ytimg.com">

<style>
  /* ============================================================
     デザイントークン（色・フォント・余白のルールをここに集約）
     この値だけ変えれば、アプリ全体の雰囲気を調整できます。
  ============================================================ */
  :root{
    --bg:#10131A;           /* ほぼ黒に近いネイビー（背景色） */
    --card:#1A1E29;         /* カードなど、背景より少し明るい面 */
    --white:#FFFFFF;
    --muted:#9497A6;        /* 補足テキストの薄いグレー */
    --ember:#FF5A36;        /* アクセントカラー（やる気の火種） */
    --ember-soft:#FF8A6B;
    --mint:#33D6A6;         /* Zoneメーター的な要素に使うミント */
    --font-display:'Zen Kaku Gothic New', sans-serif; /* 見出し・本文用 */
    --font-ui:'Inter', 'Zen Kaku Gothic New', sans-serif; /* 数字・UIラベル用 */
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; overscroll-behavior:none;
    height:100%; height:100dvh; /* dvhに対応するブラウザでは、アドレスバーの出没に強い高さ指定になる */
    font-family:var(--font-display); background:var(--bg); color:var(--white);
  }
  button{ font-family:inherit; border:none; background:none; cursor:pointer; -webkit-user-select:none; user-select:none; }

  #app{ position:fixed; inset:0; overflow:hidden; }

  /* ============================================================
     画面切り替えの共通ルール
     「.screen」を持つ要素は全て重ねて置いておき、
     「.active」がついたものだけを表示する、というシンプルな仕組み。
  ============================================================ */
  .screen{
    position:absolute; inset:0; opacity:0; pointer-events:none;
    transition:opacity .3s ease; display:flex; align-items:center; justify-content:center;
  }
  .screen.active{ opacity:1; pointer-events:auto; }

  /* ============================================================
     フィード画面（全画面のショート動画スワイプ）
  ============================================================ */
  #screen-feed{ background:#000; display:block; }

  /* 動画プレイヤーを2台（A・B）重ねて置いておく仕組み。
     詳しい理由はJS側のコメント（「二重の受け皿」）を参照。
     今表に出ている方だけ opacity:1 になる。 */
  .player-wrap{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:#000; opacity:0; z-index:0; transition:opacity .12s linear;
  }
  .player-wrap.active-player{ opacity:1; z-index:1; }
  /* YouTube Shortsと同じ感覚で、画面いっぱい(端から端まで)に動画を表示する。
     動画ごとの縦横比の違い（16:9 / 9:16 など）は、YouTube側のプレイヤーが
     自動でレターボックス（余白の黒帯）を付けて調整してくれる。 */
  .player-wrap iframe{ width:100%; height:100%; border:0; }

  /* スワイプ・タップを検知するための透明な層。
     YouTubeのiframeは別サイト（外部）の部品なので、
     その上に自分の透明な板を重ねてジェスチャーを受け取ります。 */
  #swipe-layer{
    position:absolute; inset:0; z-index:5; touch-action:none;
  }

  .top-controls{
    position:absolute; top:calc(var(--safe-top) + 14px); right:14px; z-index:10;
    display:flex; gap:10px;
  }
  .icon-btn{
    width:42px; height:42px; border-radius:50%;
    background:rgba(16,19,26,.55); backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center; font-size:18px;
  }

  .swipe-hint{
    position:absolute; left:0; right:0; bottom:calc(var(--safe-bottom) + 18px);
    text-align:center; font-family:var(--font-ui); font-size:12px; color:var(--muted);
    z-index:8; pointer-events:none; letter-spacing:.02em;
  }

  /* タップで一時停止したときに出す、真ん中の一時停止アイコン。
     「止まっているのが意図的な一時停止なのか、それとも固まっているだけなのか」を
     一目で区別できるようにするための表示。 */
  #pause-indicator{
    position:absolute; top:50%; left:50%; transform:translate(-50%, -50%);
    width:72px; height:72px; border-radius:50%;
    background:rgba(16,19,26,.55); backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center;
    font-size:30px; color:var(--white);
    opacity:0; pointer-events:none; transition:opacity .2s ease;
    z-index:6;
  }
  #pause-indicator.visible{ opacity:1; }

  /* 画面の端に常に置いておく「勉強する」ボタン。
     割り込み画面を待たなくても、いつでも自分から学習に入れるようにするための入口。
     動画の邪魔にならないよう、ミュートボタンと対になる左上の隅に、
     同じ大きさの丸アイコンボタンとして置いている（大きなピル型だと動画に被って邪魔だったため）。 */
  .quick-study-btn{
    position:fixed; top:calc(var(--safe-top) + 14px); left:14px; z-index:20;
    background:rgba(255,90,54,.94);
    transition:transform .15s ease;
  }
  .quick-study-btn:active{ transform:scale(.9); }

  #feed-loading{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:12px; color:var(--muted); font-family:var(--font-ui);
    font-size:14px; z-index:6; text-align:center; padding:0 32px; background:#000;
  }
  #feed-loading.hidden{ display:none; }

  /* ============================================================
     カード共通スタイル（啓発プロンプト／タイマー／完了画面）
  ============================================================ */
  .card{
    width:min(420px, 86vw);
    background:var(--card);
    border-radius:24px;
    padding:36px 28px calc(28px + var(--safe-bottom));
    text-align:center;
  }
  .card h1{
    margin:0 0 10px; font-size:22px; font-weight:700; line-height:1.4;
  }
  .card .sub{
    margin:0 0 10px; font-size:14px; color:var(--muted); line-height:1.7;
  }
  .card .sub:last-of-type{ margin-bottom:28px; }
  .emoji{ font-size:40px; margin:0 0 14px; }

  .btn{
    display:block; width:100%; padding:16px; border-radius:14px;
    font-family:var(--font-ui); font-size:16px; font-weight:600;
    margin-bottom:12px; transition:transform .15s ease, opacity .15s ease;
  }
  .btn:active{ transform:scale(.97); }
  .btn-primary{ background:var(--ember); color:var(--white); }
  .btn-ghost{ background:rgba(255,255,255,.08); color:var(--white); }
  .btn-text{ background:none; color:var(--muted); font-size:13px; padding:8px; margin-bottom:0; }

  /* 名前入力画面の入力欄 */
  .text-input{
    display:block; width:100%; padding:14px 16px; margin-bottom:16px;
    border-radius:14px; border:1px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.06); color:var(--white);
    font-family:var(--font-ui); font-size:16px; text-align:center;
  }
  .text-input::placeholder{ color:var(--muted); }
  .text-input:focus{ outline:none; border-color:var(--ember); }

  /* ============================================================
     啓発プロンプト画面（割り込み画面）
  ============================================================ */
  #screen-prompt{ background:rgba(16,19,26,.94); backdrop-filter:blur(10px); }

  /* ============================================================
     学習タイマー画面（ストップウォッチ）
  ============================================================ */
  .timer-display{
    font-family:var(--font-ui); font-size:56px; font-weight:700; letter-spacing:.02em;
    margin-bottom:28px; font-variant-numeric:tabular-nums;
  }
  .timer-links{ display:flex; justify-content:center; gap:8px; }
  .timer-links .btn-text{ width:auto; }

  /* ============================================================
     学習記録の一覧画面
  ============================================================ */
  .history-card{
    max-height:75vh; display:flex; flex-direction:column;
  }
  .history-list{
    overflow-y:auto; text-align:left; margin-bottom:24px;
  }
  .history-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:11px 2px; border-bottom:1px solid rgba(255,255,255,.07);
    font-family:var(--font-ui);
  }
  .history-row:last-child{ border-bottom:none; }
  .history-date{ font-size:14px; color:var(--white); }
  .history-date.is-today{ color:var(--ember-soft); font-weight:600; }
  .history-minutes{ font-size:14px; font-weight:600; color:var(--mint); font-variant-numeric:tabular-nums; }
  .history-minutes.is-empty{ color:var(--muted); font-weight:400; }

  /* ============================================================
     完了画面
  ============================================================ */
  #screen-done .emoji{ font-size:46px; }
  #done-today-time{ color:var(--mint); font-family:var(--font-ui); font-weight:600; }

  /* 累計時間・連続日数を示す、控えめな記録表示 */
  #timer-stats, #done-total-stats{
    color:var(--mint); font-family:var(--font-ui); font-size:12px; font-weight:600;
    letter-spacing:.02em;
  }

  /* ============================================================
     初回訪問時のみ表示する「ホーム画面に追加」バナー
  ============================================================ */
  #pwa-banner{
    position:fixed; left:14px; right:14px; bottom:calc(var(--safe-bottom) + 14px);
    z-index:50; background:var(--card); border-radius:16px; padding:16px 18px;
    display:flex; align-items:center; gap:12px;
    box-shadow:0 8px 30px rgba(0,0,0,.4);
    /* transform（見た目の移動）だけだと、バナーの高さによっては
       画面の下にわずかに見切れて残ってしまうことがあった。
       opacityとvisibilityも一緒に切り替えることで、確実に消えるようにしている。 */
    transform:translateY(120%);
    opacity:0;
    visibility:hidden;
    transition:transform .35s ease, opacity .35s ease, visibility 0s linear .35s;
  }
  #pwa-banner.visible{
    transform:translateY(0);
    opacity:1;
    visibility:visible;
    transition:transform .35s ease, opacity .35s ease, visibility 0s linear 0s;
  }
  #pwa-banner p{
    margin:0; font-size:13px; line-height:1.6; color:var(--white); font-family:var(--font-ui);
    flex:1;
  }
  #pwa-banner button{
    flex-shrink:0; width:34px; height:34px; border-radius:50%;
    background:rgba(255,255,255,.1); color:var(--white); font-size:16px;
  }
</style>
</head>
<body>

<div id="app">

  <!-- 2つ目以降の再生リストを裏方で読み込むための画面外スロット。
       ジャンル分け用に動画一覧を取得するだけの使い捨てプレイヤーをここに一時的に置く。 -->
  <div id="genre-loader-slot" style="position:fixed; left:-9999px; top:-9999px; width:1px; height:1px; overflow:hidden;"></div>

  <!-- ============================================================
       ⓪ 名前入力画面（初回だけ表示。記録を個人にひもづけるために使う）
  ============================================================ -->
  <section id="screen-name" class="screen">
    <div class="card">
      <p class="emoji">👋</p>
      <h1>はじめまして</h1>
      <p class="sub">記録をつけるために、お名前を教えてください。</p>
      <input type="text" id="name-input" class="text-input" placeholder="なまえ" maxlength="20" />
      <button id="btn-name-submit" class="btn btn-primary">はじめる</button>
    </div>
  </section>

  <!-- ============================================================
       ① フィード画面：全画面のショート動画スワイプ
  ============================================================ -->
  <section id="screen-feed" class="screen active">
    <!-- 動画プレイヤーを2台重ねて置く。表に出ている方（active-player）だけ見える。 -->
    <div id="yt-player-wrap-a" class="player-wrap active-player">
      <div id="yt-player-a"></div>
    </div>
    <div id="yt-player-wrap-b" class="player-wrap">
      <div id="yt-player-b"></div>
    </div>

    <div id="feed-loading">動画を読み込んでいます…</div>

    <!-- タップで一時停止したときに、真ん中に一瞬〜ずっと表示するアイコン -->
    <div id="pause-indicator" aria-hidden="true">⏸</div>

    <!-- スワイプ・タップ検知用の透明レイヤー -->
    <div id="swipe-layer"></div>

    <div class="top-controls">
      <button id="btn-mute" class="icon-btn" aria-label="ミュート切り替え">🔇</button>
    </div>

    <!-- 画面の端に常に置いておく「勉強する」ボタン。いつでも自分から学習に入れる。 -->
    <button id="btn-quick-study" class="icon-btn quick-study-btn" aria-label="勉強を始める">📚</button>

    <p class="swipe-hint">↑ 上にスワイプで次の動画　/　タップで一時停止</p>
  </section>

  <!-- ============================================================
       ② 啓発プロンプト画面（一定本数ごとに割り込み表示）
  ============================================================ -->
  <section id="screen-prompt" class="screen">
    <div class="card">
      <p class="emoji">🔥</p>
      <h1>そろそろ勉強しませんか？</h1>
      <p class="sub">動画を見る手を止めて、少しだけ机に向かってみましょう。</p>
      <button id="btn-start-study" class="btn btn-primary">はい、始める</button>
      <button id="btn-keep-watching" class="btn btn-ghost">まだ動画を見る</button>
    </div>
  </section>

  <!-- ============================================================
       ③ 学習タイマー画面（ストップウォッチ：0から数えるだけのシンプル方式）
  ============================================================ -->
  <section id="screen-timer" class="screen">
    <div class="card">
      <h1>学習タイマー</h1>
      <p class="sub" id="timer-sub">スタートを押して勉強を始めましょう</p>
      <p class="sub" id="timer-stats"></p>

      <div class="timer-display" id="timer-display">00:00</div>

      <button id="btn-timer-toggle" class="btn btn-primary">スタート</button>
      <div class="timer-links" id="timer-links">
        <button id="btn-timer-back" class="btn btn-text">動画に戻る</button>
        <button id="btn-view-history" class="btn btn-text">記録を見る</button>
      </div>
    </div>
  </section>

  <!-- ============================================================
       ④ 完了画面
  ============================================================ -->
  <section id="screen-done" class="screen">
    <div class="card">
      <p class="emoji">🎉</p>
      <h1>おつかれさまでした</h1>
      <p class="sub">今日も一歩、前進しましたね。</p>
      <p class="sub" id="done-today-time"></p>
      <p class="sub" id="done-total-stats"></p>
      <button id="btn-done-home" class="btn btn-primary">ホームに戻る</button>
    </div>
  </section>

  <!-- ============================================================
       ⑤ 学習記録の一覧画面（直近2週間の記録を日付ごとに並べるだけのシンプルな一覧）
  ============================================================ -->
  <section id="screen-history" class="screen">
    <div class="card history-card">
      <h1>学習記録</h1>
      <p class="sub" id="history-summary"></p>
      <div class="history-list" id="history-list"></div>
      <button id="btn-history-back" class="btn btn-ghost">閉じる</button>
    </div>
  </section>

  <!-- ============================================================
       ⑥ 初回訪問時だけ出す「ホーム画面に追加」バナー
  ============================================================ -->
  <div id="pwa-banner">
    <p id="pwa-banner-text"></p>
    <button id="btn-banner-close" aria-label="閉じる">✕</button>
  </div>

</div>

<script>
/* ============================================================
   ⚙️ 設定エリア（検証中はここの数値だけ触ればOK）
   ------------------------------------------------------------
   PLAYLISTS                  : 使いたいYouTube再生リストを配列で指定します。
                                 1つの再生リストは動画200本くらいまでしか読み込めない
                                 ことがあるため、リストを複数に分けておくと、その分
                                 多くの動画を候補に混ぜられます（数はいくつでもOK）。
                                 各要素は { id: "再生リストID", genre: "ジャンル名" } の形。
                                   id    : 再生リストURLの「list=」の後ろの文字列
                                           例）https://www.youtube.com/playlist?list=PLxxxxxxxxxxxxxxxx
                                                                                    ↑ここ
                                   genre : 自由に決めたジャンル名（例:"英語","数学"）。
                                           まだジャンル分けしないリストは genre:"" のままでOK。
                                           （ジャンルを設定すると、記録用ログに「よく見た
                                             ジャンル」が一緒に送られるようになります）
   FIRST_PROMPT_AFTER         : 最初に啓発プロンプトを出すタイミング（何本目の動画の後か）
   PROMPT_INTERVAL_AFTER_FIRST: 2回目以降、何本ごとにプロンプトを出すか
   LOG_ENDPOINT_URL           : 使用ログの送信先（Google Apps ScriptのウェブアプリURL）。
                                 空文字("")のままだと、ログの送信自体を行いません。
============================================================ */
const CONFIG = {
  // ⚠️ 教えてもらったURLの list= の値をそのまま設定しています。
  //    通常の再生リストIDはもう少し長い文字列（30文字前後）のことが多いので、
  //    もし動画が読み込めない場合はYouTubeアプリの「共有」→リンクをコピーで
  //    フルのURLを取り直し、list= の後ろの文字列に置き換えてください。
  PLAYLISTS: [
    { id: "PLToIvTt0MLnw", genre: "" },
    { id: "PLFB9BPLvu_yA", genre: "" } // 2つ目の再生リスト
  ],
  FIRST_PROMPT_AFTER: 15,        // 15本見たら最初のプロンプト
  PROMPT_INTERVAL_AFTER_FIRST: 10, // その後は10本ごとにプロンプト
  LOG_ENDPOINT_URL: "https://script.google.com/macros/s/AKfycbw-lxIN21S855TfWsZ5d5iuemgBKPY5hxTcWkQP7iQZ3r-f0hqnn0JsqV4Ly4sRmp3Mxg/exec"
};

/* ============================================================
   画面切り替えの小さなヘルパー
============================================================ */
function showScreen(id){
  document.querySelectorAll(".screen").forEach((el) => el.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* ============================================================
   名前の登録（初回だけ）
   ------------------------------------------------------------
   検証を「誰が・何をしたか」まで追えるようにするため、初めて開いた
   ときだけ名前を聞き、以降はlocalStorageに保存した名前を使い続けます。
   （個人を特定する情報としては名前だけを使い、それ以外の情報は
     集めません）
============================================================ */
const USER_NAME_KEY = "zonenow_mvp_user_name";

function getUserName(){
  return localStorage.getItem(USER_NAME_KEY) || "";
}

(function setupNameGate(){
  if (getUserName()){
    sendLog("session_start"); // 登録済みユーザーが開いたタイミングを毎回記録する
    return;
  }
  showScreen("screen-name");
})();

document.getElementById("btn-name-submit").addEventListener("click", submitUserName);
document.getElementById("name-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter") submitUserName();
});

function submitUserName(){
  const input = document.getElementById("name-input");
  const name = input.value.trim();
  if (!name){
    input.focus();
    return;
  }
  localStorage.setItem(USER_NAME_KEY, name);
  showScreen("screen-feed");
  sendLog("session_start"); // 名前登録が済んで、初めて使い始めたタイミングで記録する
}

/* ============================================================
   使用ログの送信
   ------------------------------------------------------------
   「誰が」「何本くらい動画を見たタイミングで」「勉強タイマーを
   いつ始めたか」「啓発プロンプトでどちらを選んだか」を、
   Google スプレッドシートに1行ずつ送って記録してもらう仕組みです。
   CONFIG.LOG_ENDPOINT_URL が空のうちは何もしません
   （ログ機能をまだ準備していない状態でも、アプリ自体は問題なく動きます）。
============================================================ */
function sendLog(eventType, detail){
  if (!CONFIG.LOG_ENDPOINT_URL) return;

  const payload = {
    name: getUserName(),
    event: eventType,
    detail: detail || ""
  };

  // Content-Typeをtext/plainにしているのは、application/jsonにすると
  // ブラウザが先に「プリフライトリクエスト」という確認を送ってしまい、
  // Google Apps Script側がそれにうまく応答できず失敗することがあるため。
  // 中身はJSON文字列のまま送り、Apps Script側でJSON.parseして読み取る。
  fetch(CONFIG.LOG_ENDPOINT_URL, {
    method: "POST",
    mode: "no-cors", // 送りっぱなしでよく、返事の中身は見ないので
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  }).catch(() => {
    // ログの送信に失敗しても、アプリ本体の動作には一切影響させない
  });
}

/* ============================================================
   勉強時間の記録
   ------------------------------------------------------------
   localStorageに「日付ごとの合計勉強秒数」を保存しておく、簡易的な記録機能。
   ページを閉じても、翌日以降もブラウザに残り続けます。
   「今日の分」だけでなく、「累計」「連続で記録がある日数」も
   ここから計算して、タイマー画面・完了画面に表示しています。
============================================================ */
const STUDY_LOG_KEY = "zonenow_mvp_study_log";

// 指定した日付の「YYYY-MM-DD」キーを作る
function getDateKey(date){
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const day = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

function getTodayKey(){
  return getDateKey(new Date());
}

function loadStudyLog(){
  try {
    return JSON.parse(localStorage.getItem(STUDY_LOG_KEY)) || {};
  } catch (e){
    return {}; // 保存データが壊れていた場合は空として扱う
  }
}

function addStudyTime(seconds){
  if (seconds <= 0) return;
  const log = loadStudyLog();
  const key = getTodayKey();
  log[key] = (log[key] || 0) + seconds;
  localStorage.setItem(STUDY_LOG_KEY, JSON.stringify(log));
}

function getTodayStudySeconds(){
  const log = loadStudyLog();
  return log[getTodayKey()] || 0;
}

// これまでの記録をすべて合計した時間
function getTotalStudySeconds(){
  const log = loadStudyLog();
  return Object.keys(log).reduce((sum, key) => sum + (log[key] || 0), 0);
}

// 今日（今日まだ記録がなければ昨日）から遡って、何日連続で記録があるか
function getStudyStreak(){
  const log = loadStudyLog();
  const cursor = new Date();
  if (!(log[getDateKey(cursor)] > 0)){
    cursor.setDate(cursor.getDate() - 1); // 今日はまだ勉強していないだけかもしれないので、連続記録は途切れさせない
  }
  let streak = 0;
  while (log[getDateKey(cursor)] > 0){
    streak++;
    cursor.setDate(cursor.getDate() - 1);
  }
  return streak;
}

function formatStudyDuration(totalSeconds){
  const totalMinutes = Math.floor(totalSeconds / 60);
  const hours = Math.floor(totalMinutes / 60);
  const minutes = totalMinutes % 60;
  if (hours > 0) return `${hours}時間${minutes}分`;
  return `${minutes}分`;
}

// 「累計〇時間〇分・〇日連続」の1行を作る。記録がまだなければ空文字を返す
function formatStudyStatsLine(){
  const total = getTotalStudySeconds();
  if (total <= 0) return "";
  return `累計 ${formatStudyDuration(total)}　・　${getStudyStreak()}日連続`;
}

// タイマー画面・完了画面の「累計・連続日数」表示を、今の記録に合わせて更新する
function renderStudyStats(){
  const line = formatStudyStatsLine();
  [document.getElementById("timer-stats"), document.getElementById("done-total-stats")].forEach((el) => {
    if (!el) return;
    el.textContent = line;
    el.style.display = line ? "" : "none";
  });
}

// 「学習記録」画面：直近14日分を、新しい日から順に並べるだけのシンプルな一覧
const HISTORY_DAYS = 14;

function renderHistoryScreen(){
  const log = loadStudyLog();
  const listEl = document.getElementById("history-list");
  const summaryEl = document.getElementById("history-summary");
  listEl.textContent = ""; // 前回描画した分をクリアする

  const todayKey = getTodayKey();
  const weekdayNames = ["日", "月", "火", "水", "木", "金", "土"];

  for (let i = 0; i < HISTORY_DAYS; i++){
    const d = new Date();
    d.setDate(d.getDate() - i);
    const key = getDateKey(d);
    const seconds = log[key] || 0;
    const isToday = key === todayKey;

    const row = document.createElement("div");
    row.className = "history-row";

    const dateEl = document.createElement("span");
    dateEl.className = "history-date" + (isToday ? " is-today" : "");
    dateEl.textContent = `${d.getMonth() + 1}/${d.getDate()}(${weekdayNames[d.getDay()]})` + (isToday ? " 今日" : "");

    const minutesEl = document.createElement("span");
    if (seconds > 0){
      minutesEl.className = "history-minutes";
      minutesEl.textContent = formatStudyDuration(seconds);
    } else {
      minutesEl.className = "history-minutes is-empty";
      minutesEl.textContent = "記録なし";
    }

    row.appendChild(dateEl);
    row.appendChild(minutesEl);
    listEl.appendChild(row);
  }

  summaryEl.textContent = formatStudyStatsLine() || "まだ記録がありません";
}

document.getElementById("btn-view-history").addEventListener("click", () => {
  renderHistoryScreen();
  showScreen("screen-history");
});

document.getElementById("btn-history-back").addEventListener("click", () => {
  showScreen("screen-timer");
});

/* ============================================================
   ① YouTube IFrame Player API まわり
   ------------------------------------------------------------
   YouTube側が用意しているスクリプト（下の<script>タグ）を読み込むと、
   自動的に「onYouTubeIframeAPIReady」という名前の関数が呼ばれます。

   ★動画をスムーズに切り替えるための工夫（二重の受け皿）★
   プレイヤーを1台だけで使うと、次の動画に切り替えるたびに
   「読み込み待ち」が発生してカクつきます。
   そこで、プレイヤーを2台(A・B)用意しておき、
   　・今見えている方（表）を再生
   　・もう片方（裏）には、次に見る動画をあらかじめこっそり読み込んでおく
   という「先読み」をしておくことで、スワイプした瞬間には
   もう準備が終わっている状態を作り、切り替えを滑らかにしています。

   先読みには cueVideoById を使っています（YouTube公式が「再生はせず
   準備だけしておく」ために用意している安全な方法）。

   ★再生の指示(playVideo())は、1回の切り替えにつき必ず1回だけ★
   同じタイミングでplayVideo()を2回送ると、YouTube側のプレイヤーが
   混乱して読み込み状態（UNSTARTED）に巻き戻ったまま止まってしまう
   ことが実機の検証でわかりました。そのため、ミュートのON/OFFを行う
   applyMuteState()は再生の指示を一切出さず、「再生してね」という
   指示は呼び出し元でそれぞれ1回だけ行う、という役割分担にしています。
   万が一それでも再生が止まってしまった場合の保険として、
   スワイプの少し後に本当に再生できているか確認し、止まっていたら
   動画を読み込み直すwatchPlaybackRecovery() も併用しています。
============================================================ */
const players = { a: null, b: null }; // 2台のプレイヤー
let activeKey = "a";     // 今、表に出ているのはどちらか
let videoIds = [];       // 再生リストに入っている動画IDの並び
let currentIndex = 0;    // 今何本目を再生しているか
let standbyIndex = null; // 裏側のプレイヤーに、次はどの動画を仕込んであるか
let videoHistory = [];   // 表示した動画のインデックス履歴（下スワイプで戻れるようにするため）
let watchedCount = 0;    // ここまでに視聴を終えた（または送り飛ばした）動画の本数
let isMuted = true;
let isPaused = false;    // タップで一時停止しているかどうか
let cameFromPrompt = false; // タイマー画面に「啓発プロンプト経由」で来たかどうか
let videoGenreMap = {};    // 動画ID → ジャンル名 の対応表（genre:""のリストの動画は登録されない）
let genreWatchCounts = {}; // このセッションで見たジャンルごとの本数（記録ログに使う）

function otherKey(key){ return key === "a" ? "b" : "a"; }
function getActivePlayer(){ return players[activeKey]; }

// 動画一覧の中から、指定したインデックス以外をランダムに1つ選ぶ
// （「完全ランダム」だが、直前と同じ動画が連続で出るのだけは避ける）
function pickRandomIndex(excludeIndex){
  if (videoIds.length === 0) return 0;
  if (videoIds.length === 1) return 0;
  let idx;
  do {
    idx = Math.floor(Math.random() * videoIds.length);
  } while (idx === excludeIndex);
  return idx;
}

function onYouTubeIframeAPIReady(){
  players.a = new YT.Player("yt-player-a", {
    playerVars: {
      listType: "playlist",
      list: CONFIG.PLAYLISTS[0].id,
      autoplay: 1,
      mute: 1,          // ブラウザの自動再生ポリシー上、最初はミュート必須
      controls: 0,       // YouTube標準のコントロールは消し、自前のUIだけにする
      disablekb: 1,
      fs: 0,
      playsinline: 1,    // iPhoneでも画面いっぱいの自動再生を許可する設定
      rel: 0,
      modestbranding: 1,
      iv_load_policy: 3,
      cc_load_policy: 0  // 字幕は自動で出さない（動画自体に焼き込まれた字幕までは消せません）
    },
    events: {
      onReady: onPrimaryPlayerReady,
      onStateChange: onPlayerStateChange,
      onError: onPlayerError
    }
  });
}

// 同じ動画IDが2つの再生リストに重複して入っていても、候補としては1本にまとめる
function mergeVideoIds(listA, listB){
  return Array.from(new Set(listA.concat(listB)));
}

function onPrimaryPlayerReady(){
  document.getElementById("feed-loading").classList.add("hidden");

  // 1つ目の再生リストの中身（動画IDの並び）を取得する
  videoIds = players.a.getPlaylist() || [];
  currentIndex = players.a.getPlaylistIndex() || 0;
  tagGenreForVideoIds(videoIds, CONFIG.PLAYLISTS[0].genre);

  // 最初の1本も含めて完全ランダムにするため、ここで見る動画を選び直す
  if (videoIds.length > 1){
    currentIndex = pickRandomIndex(-1); // -1は「除外する動画がない」という意味
    players.a.loadVideoById(videoIds[currentIndex]);
  }

  activeKey = "a";
  applyMuteState();

  // 裏側担当のプレイヤーBは「先読み専用」として用意する（再生リストの読み込みは別で行う）
  players.b = new YT.Player("yt-player-b", {
    playerVars: {
      mute: 1, controls: 0, disablekb: 1, fs: 0,
      playsinline: 1, rel: 0, modestbranding: 1, iv_load_policy: 3, cc_load_policy: 0
    },
    events: {
      onReady: preloadStandbyVideo,
      onStateChange: onPlayerStateChange,
      onError: onPlayerError
    }
  });

  // 2つ目以降の再生リストは、画面に見えない裏方の専用プレイヤーで1つずつこっそり
  // 読み込み、動画候補一覧とジャンル対応表に混ぜ込んでいく（表示中の再生には無関係）
  loadRemainingPlaylists(CONFIG.PLAYLISTS.slice(1));
}

// ジャンル名が設定されている再生リストの動画IDだけ、対応表に記録する
function tagGenreForVideoIds(ids, genre){
  if (!genre) return;
  ids.forEach((id) => { videoGenreMap[id] = genre; });
}

// 2本目以降の再生リストを、画面外に置いた使い捨てのプレイヤーで1つずつ読み込み、
// 動画候補一覧（videoIds）とジャンル対応表（videoGenreMap）に混ぜ込んでいく。
// 見えている再生（プレイヤーA・B）にはまったく手を出さない、完全に裏方の処理。
function loadRemainingPlaylists(playlists){
  if (playlists.length === 0) return;
  const [current, ...rest] = playlists;

  const loaderEl = document.createElement("div");
  document.getElementById("genre-loader-slot").appendChild(loaderEl);

  const finishThisOne = (loaderPlayer) => {
    if (loaderPlayer && typeof loaderPlayer.destroy === "function") loaderPlayer.destroy();
    loaderEl.remove();
    loadRemainingPlaylists(rest); // 続けて次のリストを読み込む
  };

  const loader = new YT.Player(loaderEl, {
    playerVars: {
      listType: "playlist", list: current.id,
      mute: 1, controls: 0, disablekb: 1, fs: 0, playsinline: 1
    },
    events: {
      onReady: (event) => {
        const ids = event.target.getPlaylist() || [];
        videoIds = mergeVideoIds(videoIds, ids);
        tagGenreForVideoIds(ids, current.genre);
        finishThisOne(event.target);
      },
      onError: () => finishThisOne(loader) // このリストが読み込めなくても、残りは続けて読み込む
    }
  });
}

// 裏側のプレイヤーに、次に見る動画（ランダムに選んだもの）をこっそり読み込んでおく（再生はしない＝cue）
function preloadStandbyVideo(){
  const standby = players[otherKey(activeKey)];
  if (!standby || typeof standby.cueVideoById !== "function" || videoIds.length === 0) return;
  standbyIndex = pickRandomIndex(currentIndex);
  standby.cueVideoById(videoIds[standbyIndex]);
}

// 動画の再生でエラーが起きたときの処理。
// 「再生リストそのものが読み込めない」のと「リスト内の1本が非公開・削除済み
// などで再生できない」は分けて扱う。後者は珍しくないので、画面を止めずに
// 静かに他の動画へ切り替える（毎回エラー画面を出すと使い勝手が悪いため）。
function onPlayerError(event){
  if (videoIds.length === 0){
    document.getElementById("feed-loading").classList.remove("hidden");
    document.getElementById("feed-loading").textContent =
      "動画を読み込めませんでした。少し待ってから、もう一度開き直してみてください。";
    return;
  }

  const firedKey = (event && event.target === players.a) ? "a" : "b";
  if (firedKey === activeKey){
    advanceToStandby(); // 今見ようとしていた動画がダメだったので、次へ進む
  } else {
    preloadStandbyVideo(); // 裏で先読みしていた動画がダメだったので、別の候補に仕込み直す
  }
}

// プレイヤーの状態が変わるたびに呼ばれる（再生中・一時停止・終了、など）
function onPlayerStateChange(event){
  const firedKey = (event.target === players.a) ? "a" : "b";

  // 今表に出ているプレイヤー以外（＝裏で先読み中のプレイヤー）の変化は無視する
  if (firedKey !== activeKey) return;

  if (event.data === YT.PlayerState.PLAYING){
    // 念のため、実際に再生が始まったタイミングでもミュート状態を反映しておく
    // （スワイプ操作時に一度反映しているが、二重にかけても害はないための保険）
    applyMuteState();
  }

  if (event.data === YT.PlayerState.ENDED){
    handleVideoAdvance();
  }
}

/* ============================================================
   動画が1本終わった／送られたときの共通処理
   ------------------------------------------------------------
   「動画の自然終了」と「上スワイプでの送り」を同じ扱いにしています。
   （どちらも「その動画は見終えた」とみなすのが、
     もっともシンプルに仮説検証を進められると判断したためです）
============================================================ */
function handleVideoAdvance(){
  const watchedGenre = videoGenreMap[videoIds[currentIndex]];
  if (watchedGenre) genreWatchCounts[watchedGenre] = (genreWatchCounts[watchedGenre] || 0) + 1;

  watchedCount++;

  if (shouldShowPrompt(watchedCount)){
    showPromptScreen();
  } else {
    advanceToStandby();
  }
}

// 「今、啓発プロンプトを出すべきタイミングか」を判定する
// 例）FIRST_PROMPT_AFTER=20, INTERVAL=10 なら → 20本目、30本目、40本目…で表示
function shouldShowPrompt(count){
  if (count < CONFIG.FIRST_PROMPT_AFTER) return false;
  if (count === CONFIG.FIRST_PROMPT_AFTER) return true;
  return (count - CONFIG.FIRST_PROMPT_AFTER) % CONFIG.PROMPT_INTERVAL_AFTER_FIRST === 0;
}

// 「ジャンル名6/ジャンル名4」のように、多く見た順に並べた内訳の文字列を作る
// （ジャンルが1つも設定されていなければ空文字を返す）
function formatGenreBreakdown(){
  const genres = Object.keys(genreWatchCounts);
  if (genres.length === 0) return "";
  return genres
    .sort((a, b) => genreWatchCounts[b] - genreWatchCounts[a])
    .map((g) => `${g}${genreWatchCounts[g]}`)
    .join("/");
}

function showPromptScreen(){
  const active = getActivePlayer();
  if (active && typeof active.pauseVideo === "function") active.pauseVideo();
  cancelPendingPlaybackRecovery(); // この一時停止は意図的なものなので、見張り役に復旧させない
  resetPauseState(); // タップでの一時停止表示は消しておく（フィードに戻ったら再生から始めるため）
  const genreBreakdown = formatGenreBreakdown();
  sendLog("prompt_shown", "視聴本数:" + watchedCount + (genreBreakdown ? "　ジャンル内訳:" + genreBreakdown : ""));
  showScreen("screen-prompt");
}

// 裏で先読みしておいた「ランダムな次の動画」に、表と裏を入れ替えながら切り替える
function advanceToStandby(){
  resetPauseState(); // スワイプしたら、一時停止中でも必ず再生から始める

  if (videoIds.length < 2 || !players.b || standbyIndex === null){
    // 先読みの仕組みがまだ準備できていない場合（起動直後にすぐ連続でスワイプした場合など）。
    // 動画一覧がもう複数本ある状態なら、同じ動画を繰り返すのではなく、
    // その場で別のランダムな動画を選んで直接読み込む。
    const active = getActivePlayer();
    if (active && videoIds.length > 1 && typeof active.loadVideoById === "function"){
      currentIndex = pickRandomIndex(currentIndex);
      active.loadVideoById(videoIds[currentIndex]);
      applyMuteState();
    } else if (active && typeof active.seekTo === "function"){
      active.seekTo(0);
      active.playVideo();
    }
    return;
  }

  const oldKey = activeKey;
  const oldPlayer = players[oldKey];
  if (oldPlayer && typeof oldPlayer.pauseVideo === "function") oldPlayer.pauseVideo();

  // 今見ていた動画を履歴に残しておく（下スワイプで戻れるように）
  videoHistory.push(currentIndex);

  // 表と裏を入れ替える。裏に用意しておいたランダムな動画が新しい「表」になる。
  activeKey = otherKey(oldKey);
  currentIndex = standbyIndex;

  // ミュート状態を反映してから、1回だけ再生を指示する
  applyMuteState();
  const newActive = getActivePlayer();
  if (newActive && typeof newActive.playVideo === "function") newActive.playVideo();
  swapPlayerVisibility();
  watchPlaybackRecovery(newActive);

  // 裏に回った方（さっきまで表だった方）に、また新しくランダムな動画を仕込んでおく
  standbyIndex = pickRandomIndex(currentIndex);
  if (oldPlayer && typeof oldPlayer.cueVideoById === "function" && videoIds[standbyIndex]){
    oldPlayer.cueVideoById(videoIds[standbyIndex]);
  }
}

// 保険：スワイプ後、何らかの理由で再生されないまま固まってしまっていないかを
// 少し後で確認し、止まっていたら「その動画をもう一度最初から読み込み直す」
// （原因を問わない安全策。単にplayVideo()をもう一度送るだけでは復活しない
// ケースがあったため、loadVideoById()でしっかり読み込み直す方式にしている）。
// BUFFERING中（順調に読み込み中）はまだ何もせず、本当に止まっている
// （UNSTARTED/PAUSED/CUEDのまま動かない）ときだけ手を出す。
// 1回だけだと復帰しないケースもありうるため、間隔を空けて数回試す。
//
// ★予約が「賞味期限切れ」で誤発火しないようにする仕組み★
// この予約(setTimeout)は数秒後に発火するが、その間に
// ・もっと新しいスワイプが起きていたら → 今回の予約はもう古いので何もしない
// ・タイマー画面など、フィード画面から離れていたら → 今の一時停止は意図的なので何もしない
// のどちらかであれば、動画を勝手に読み込み直したり再生したりしないようにする。
// （これを怠ると、スワイプ直後にタイマーを始めた場合などに、
//   古い予約だけが後から律儀に発火して勝手に音声が流れ出す不具合になる）
let playbackRecoveryToken = 0;
function cancelPendingPlaybackRecovery(){
  playbackRecoveryToken++;
}

function watchPlaybackRecovery(player){
  if (!player) return;
  playbackRecoveryToken++;
  const myToken = playbackRecoveryToken;
  const stuckStates = [YT.PlayerState.UNSTARTED, YT.PlayerState.PAUSED, YT.PlayerState.CUED];
  [1000, 2200, 3600].forEach((delay) => {
    setTimeout(() => {
      if (myToken !== playbackRecoveryToken) return; // もっと新しいスワイプ等で予約が上書きされていたら何もしない
      if (!document.getElementById("screen-feed").classList.contains("active")) return; // フィード画面にいなければ何もしない
      if (isPaused) return; // ユーザーが意図的に一時停止しているなら何もしない
      if (player !== getActivePlayer()) return; // その間にさらにスワイプしていたら何もしない
      if (typeof player.getPlayerState !== "function") return;
      const state = player.getPlayerState();
      if (stuckStates.indexOf(state) === -1) return; // 再生中・読み込み中なら何もしない

      if (typeof player.loadVideoById === "function" && videoIds[currentIndex]){
        player.loadVideoById(videoIds[currentIndex]);
        applyMuteState();
      } else if (typeof player.playVideo === "function"){
        player.playVideo();
      }
    }, delay);
  });
}

function swapPlayerVisibility(){
  document.getElementById("yt-player-wrap-a").classList.toggle("active-player", activeKey === "a");
  document.getElementById("yt-player-wrap-b").classList.toggle("active-player", activeKey === "b");
}

// 下スワイプ＝直前まで見ていた動画に戻る（履歴を1つ遡る）。
// ランダム再生なので「前の動画」という概念はないが、履歴を覚えておくことで
// 「今見たばかりの動画にもう一度戻る」操作だけは自然にできるようにしている。
// これは「見終えた」扱いにはしないので、プロンプト判定はしない。
function goToPreviousVideo(){
  if (videoHistory.length === 0) return; // 戻れる履歴がない（見始めたばかり）

  resetPauseState(); // スワイプしたら、一時停止中でも必ず再生から始める
  currentIndex = videoHistory.pop();
  const active = getActivePlayer();
  if (active && typeof active.loadVideoById === "function"){
    active.loadVideoById(videoIds[currentIndex]);
    applyMuteState();
    watchPlaybackRecovery(active);
  }
  preloadStandbyVideo(); // 裏側には、また新しいランダムな候補を仕込み直す
}

// ★重要：この関数はミュートのON/OFFだけを行い、再生の指示(playVideo())は
// 一切出さない。再生の指示は、必要な場所で1回だけ行うのが正しい
// （2回同時に送るとYouTube側のプレイヤーが混乱して固まることがある）。
function applyMuteState(){
  const p = getActivePlayer();
  if (!p) return;
  if (isMuted){
    if (typeof p.mute === "function") p.mute();
  } else {
    if (typeof p.unMute === "function") p.unMute();
  }
}

/* ============================================================
   フィード画面のジェスチャー操作（スワイプ・タップ）
   ------------------------------------------------------------
   YouTubeのiframeは外部サイトの部品なので、直接タッチイベントを
   取れません。そこで透明な板（#swipe-layer）を上に重ねて、
   そこでタッチの動きを判定しています。
============================================================ */
const swipeLayer = document.getElementById("swipe-layer");
let touchStartY = 0;
let touchStartX = 0;
let touchStartTime = 0;

swipeLayer.addEventListener("touchstart", (e) => {
  touchStartY = e.touches[0].clientY;
  touchStartX = e.touches[0].clientX;
  touchStartTime = Date.now();
}, { passive: true });

swipeLayer.addEventListener("touchend", (e) => {
  if (!getActivePlayer()) return;
  const touchEndY = e.changedTouches[0].clientY;
  const touchEndX = e.changedTouches[0].clientX;
  const deltaY = touchEndY - touchStartY;
  const deltaX = touchEndX - touchStartX;
  const elapsed = Date.now() - touchStartTime;

  const isMostlyVertical = Math.abs(deltaY) > Math.abs(deltaX);
  const SWIPE_THRESHOLD = 60; // これ以上動いたら「スワイプ」とみなす距離(px)
  const TAP_THRESHOLD = 12;   // これ以下の移動なら「タップ」とみなす距離(px)

  if (isMostlyVertical && Math.abs(deltaY) > SWIPE_THRESHOLD){
    if (deltaY < 0){
      // 上スワイプ → 次の動画へ
      handleVideoAdvance();
    } else {
      // 下スワイプ → 前の動画へ
      goToPreviousVideo();
    }
  } else if (Math.abs(deltaY) < TAP_THRESHOLD && Math.abs(deltaX) < TAP_THRESHOLD && elapsed < 300){
    // 軽いタップ → 一時停止/再生の切り替え（音のON/OFFは右上の専用ボタンで行う）
    togglePause();
  }
}, { passive: true });

// マウス操作（PCでの動作確認用）にもかんたんに対応
document.getElementById("btn-mute").addEventListener("click", toggleMute);

function toggleMute(){
  const p = getActivePlayer();
  if (!p) return;
  isMuted = !isMuted;
  applyMuteState();
  // ミュート解除ボタン単体のタップでは（スワイプのように他の再生指示と
  // 重ならないので）念のため一度だけ再生も促しておく（安全な保険）
  if (!isMuted && typeof p.playVideo === "function") p.playVideo();
  document.getElementById("btn-mute").textContent = isMuted ? "🔇" : "🔊";
}

// 動画をタップして一時停止・再生を切り替える
function togglePause(){
  const p = getActivePlayer();
  if (!p) return;
  isPaused = !isPaused;
  const indicator = document.getElementById("pause-indicator");
  if (isPaused){
    if (typeof p.pauseVideo === "function") p.pauseVideo();
    cancelPendingPlaybackRecovery(); // 意図的な一時停止なので、見張り役に復旧させない
    indicator.classList.add("visible");
  } else {
    if (typeof p.playVideo === "function") p.playVideo();
    indicator.classList.remove("visible");
  }
}

// 一時停止中の表示を解除する（動画を切り替えるときに使う）
function resetPauseState(){
  isPaused = false;
  const indicator = document.getElementById("pause-indicator");
  if (indicator) indicator.classList.remove("visible");
}

/* ============================================================
   画面の端に常に置いてある「勉強する」ボタン
   ------------------------------------------------------------
   啓発プロンプトを待たなくても、自分の意思でいつでも学習に入れる入口。
   （見ていた動画は終わっていないので、戻ってきたら続きから再生する）
============================================================ */
document.getElementById("btn-quick-study").addEventListener("click", () => {
  const active = getActivePlayer();
  if (active && typeof active.pauseVideo === "function") active.pauseVideo();
  cancelPendingPlaybackRecovery(); // この一時停止は意図的なものなので、見張り役に復旧させない
  resetPauseState(); // タップでの一時停止表示は消しておく（フィードに戻ったら再生から始めるため）
  cameFromPrompt = false;
  showScreen("screen-timer");
});

/* ============================================================
   ② 啓発プロンプト画面のボタン操作
============================================================ */
document.getElementById("btn-start-study").addEventListener("click", () => {
  sendLog("prompt_choice", "選択:はい、始める");
  cameFromPrompt = true; // 動画は見終わっているので、戻るときは次の動画から再開する
  showScreen("screen-timer");
});

document.getElementById("btn-keep-watching").addEventListener("click", () => {
  sendLog("prompt_choice", "選択:まだ動画を見る");
  advanceToStandby();
  showScreen("screen-feed");
});

/* ============================================================
   ③ 学習タイマー（ただのストップウォッチ）
   ------------------------------------------------------------
   目標時間などは決めず、スタートを押した瞬間から0:00で数え始め、
   ストップを押すまでひたすら数字が増え続けるだけのシンプルな方式。

   ★記録が消えないようにする工夫★
   以前は「ストップを押した瞬間」にしか記録を保存していなかったため、
   ストップを押し忘れたままアプリを閉じたり、スマホの電池が切れたり
   すると、その日の勉強時間が丸ごと消えてしまっていました。
   そこで、動作中は15秒ごとに「そこまでの分」を少しずつ記録に
   足していく方式にしています（checkpointStudyTime）。
   これなら万が一ストップを押せなかった場合でも、最後の15秒未満が
   記録されないだけで済みます。

   ★画面が裏に回っても正しく動くようにする工夫★
   スマホでロック画面にしたり、他のアプリに切り替えたりすると、
   ブラウザは電池を節約するためにsetIntervalの動きを遅らせたり
   止めたりすることがあります（「1秒ごとに+1する」だけの数え方だと、
   裏に回っている間ずっと止まったままになってしまう）。
   そこで「1秒ごとに+1」ではなく、「スタートを押した実際の時刻」を
   覚えておき、そこから現在時刻までの差を毎回計算し直す方式にしています。
   これなら裏に回っていた時間も含めて、画面に戻った瞬間に正しい数字へ
   ちゃんと追いつきます。
============================================================ */
let stopwatchSec = 0;         // 画面に表示している経過時間（秒）
let stopwatchStartedAt = null; // スタートを押した瞬間の時刻（Date.now()の値）
let timerIntervalId = null;
let timerRunning = false;

let lastCheckpointSec = 0;  // 記録として保存済みの経過秒数（この先の差分だけを追加保存する）
let lastCheckpointAt = 0;   // 最後にチェックポイント保存をした実時刻（Date.now()の値）
const CHECKPOINT_INTERVAL_MS = 15000; // 15秒ごとに記録を保存する

const timerDisplay = document.getElementById("timer-display");
const timerSub = document.getElementById("timer-sub");
const timerToggleBtn = document.getElementById("btn-timer-toggle");
const timerLinks = document.getElementById("timer-links"); // 「動画に戻る」「記録を見る」をまとめて表示/非表示する

function renderTimer(){
  const min = Math.floor(stopwatchSec / 60).toString().padStart(2, "0");
  const sec = (stopwatchSec % 60).toString().padStart(2, "0");
  timerDisplay.textContent = `${min}:${sec}`;
}

// 「スタートした実際の時刻」と「今」の差から、経過秒数を計算し直す
function updateStopwatchFromClock(){
  if (!timerRunning || stopwatchStartedAt === null) return;
  stopwatchSec = Math.floor((Date.now() - stopwatchStartedAt) / 1000);
  renderTimer();
  maybeCheckpointStudyTime();
}

// 前回の保存から15秒以上経っていたら、その差分を記録に足しておく
function maybeCheckpointStudyTime(){
  if (Date.now() - lastCheckpointAt < CHECKPOINT_INTERVAL_MS) return;
  const delta = stopwatchSec - lastCheckpointSec;
  if (delta > 0){
    addStudyTime(delta);
    lastCheckpointSec = stopwatchSec;
    renderStudyStats(); // 記録が増えた分を、その場で表示にも反映する
  }
  lastCheckpointAt = Date.now();
}

// 画面が裏から表に戻ってきた瞬間に、経過時間のズレをすぐ正しく直す
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) updateStopwatchFromClock();
});

timerToggleBtn.addEventListener("click", () => {
  if (!timerRunning){
    startStopwatch();
  } else {
    stopStopwatch();
  }
});

function startStopwatch(){
  timerRunning = true;
  stopwatchStartedAt = Date.now();
  lastCheckpointSec = 0;
  lastCheckpointAt = Date.now();
  sendLog("timer_start");
  timerToggleBtn.textContent = "ストップ";
  timerSub.textContent = "がんばって！終わったらストップを押してね";
  // 勉強中は「動画に戻る」「記録を見る」で寄り道できないようにする（ほかの機能は不要、との方針のため）
  timerLinks.style.display = "none";

  timerIntervalId = setInterval(updateStopwatchFromClock, 1000);
}

function stopStopwatch(){
  updateStopwatchFromClock(); // 止める直前の正確な経過時間を確定させる
  clearInterval(timerIntervalId);
  timerIntervalId = null;
  timerRunning = false;

  // すでにチェックポイントで保存済みの分は除いて、残りの差分だけを記録に足す
  const remaining = stopwatchSec - lastCheckpointSec;
  if (remaining > 0) addStudyTime(remaining);
  lastCheckpointSec = 0;

  sendLog("timer_stop", "経過時間:" + formatStudyDuration(stopwatchSec));

  document.getElementById("done-today-time").textContent =
    "今日の合計勉強時間: " + formatStudyDuration(getTodayStudySeconds());
  renderStudyStats();

  stopwatchSec = 0;
  stopwatchStartedAt = null;
  renderTimer();
  timerToggleBtn.textContent = "スタート";
  timerSub.textContent = "スタートを押して勉強を始めましょう";
  timerLinks.style.display = "";

  showScreen("screen-done");
}

document.getElementById("btn-timer-back").addEventListener("click", () => {
  resumeFeedFromTimer();
});

/* ============================================================
   ④ 完了画面 → ホームへ戻る
============================================================ */
document.getElementById("btn-done-home").addEventListener("click", () => {
  resumeFeedFromTimer();
});

// タイマー画面／完了画面から、フィード画面に戻るときの共通処理
function resumeFeedFromTimer(){
  clearInterval(timerIntervalId);
  timerIntervalId = null;
  timerRunning = false;
  stopwatchSec = 0;
  stopwatchStartedAt = null;
  renderTimer();
  timerToggleBtn.textContent = "スタート";
  timerSub.textContent = "スタートを押して勉強を始めましょう";
  timerLinks.style.display = "";
  showScreen("screen-feed");

  if (cameFromPrompt){
    // 啓発プロンプト経由で来た場合、その動画はもう見終わっているので次の動画に進む
    advanceToStandby();
  } else {
    // 「勉強するボタン」から直接来た場合、見ていた動画の続きを再生する
    resetPauseState();
    const active = getActivePlayer();
    if (active && typeof active.playVideo === "function") active.playVideo();
  }
  cameFromPrompt = false;
}

/* ============================================================
   ⑥ 初回訪問時だけ「ホーム画面に追加」バナーを出す
   ------------------------------------------------------------
   localStorageは、ブラウザに小さなデータを保存しておける仕組みです。
   一度「訪問済み」と記録しておけば、次回以降はバナーを出しません。

   ★注意：ホーム画面に追加したあとのアプリは、ブラウザの普通のタブとは
   localStorageが別扱いになることがある（特にiPhone）。そのため
   「訪問済みかどうか」の記録だけに頼ると、追加した後のアプリ側では
   記録が引き継がれず、バナーが再び出てしまうことがあった。
   そこで、そもそも今すでにホーム画面から起動しているアプリなら
   （＝追加はもう済んでいるはずなので）、記録を見るまでもなく
   バナー自体を絶対に出さないようにしている。
============================================================ */
(function setupFirstVisitBanner(){
  const isRunningAsInstalledApp =
    window.matchMedia("(display-mode: standalone)").matches || // Android等
    window.navigator.standalone === true;                       // iPhoneのSafari

  if (isRunningAsInstalledApp) return; // すでに追加済みのアプリなら何もしない

  const STORAGE_KEY = "zonenow_mvp_visited";
  const alreadyVisited = localStorage.getItem(STORAGE_KEY);

  if (alreadyVisited) return; // 2回目以降は何もしない

  // 端末に応じて、案内文を少しだけ変える
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const message = isIOS
    ? "ホーム画面に追加すると、アプリのようにすぐ開けます。共有ボタン（□に↑）→「ホーム画面に追加」を選んでください。"
    : "ホーム画面に追加すると、アプリのようにすぐ開けます。メニュー（⋮）→「ホーム画面に追加」または「インストール」を選んでください。";

  document.getElementById("pwa-banner-text").textContent = message;

  // 少し遅らせて表示（開いた瞬間に動画へ集中してもらうため）
  setTimeout(() => {
    document.getElementById("pwa-banner").classList.add("visible");
  }, 1500);

  // 「初めて開いた」という記録は、この時点でもう残しておく
  // （バナーを閉じなくても、次回以降は表示されないようにするため）
  localStorage.setItem(STORAGE_KEY, "true");
})();

document.getElementById("btn-banner-close").addEventListener("click", () => {
  document.getElementById("pwa-banner").classList.remove("visible");
});

// タイマー画面を最初に表示する前から、これまでの記録が見えるようにしておく
renderStudyStats();

/* ============================================================
   ⑦ Service Workerの登録（PWA対応に必須）
============================================================ */
if ("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch((err) => {
      console.error("Service Workerの登録に失敗しました", err);
    });
  });
}
</script>
